<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strike Details">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Strike Details | Controle</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  // App instalável só no acesso interno (a página do cliente, /cliente, fica como site comum).
  if (!/^\/cliente\/?$/.test(location.pathname)) {
    var mf = document.createElement('link'); mf.rel = 'manifest'; mf.href = '/manifest.webmanifest';
    document.head.appendChild(mf);
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F2F2F1;
  --surface: #FFFFFF;
  --soft: #F7F7F6;
  --ink: #121212;
  --ink-2: #3B3B3B;
  --muted: #6F6F6F;
  --line: #E2E2E0;
  --line-2: #CDCDCA;
  --primary: #121212;
  --primary-grad: linear-gradient(180deg, #242426 0%, #0d0d0e 55%, #000000 100%);
  --primary-ink: #FFFFFF;
  --warn: #9A5B00;
  --warn-bg: #FFF3DC;
  --danger: #B42318;
  --danger-bg: #FDECEA;
  --ok: #1D6B40;
  --brand: "Archivo Black", "Arial Black", sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 64px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
img { display: block; max-width: 100%; }

/* ---------- Estrutura ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
}
.topbar-in { max-width: 1040px; margin: 0 auto; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark { display: flex; align-items: center; gap: 8px; font: 400 17px/1 var(--brand); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.wordmark-ico { height: 16px; width: auto; display: block; flex: none; }
.wordmark-txt { height: 15px; width: auto; display: block; flex: none; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who-name { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-name b { color: var(--ink); font-weight: 600; }
button.who-name { border: 0; background: none; padding: 4px 0; font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
.notif-aparelho { display: grid; gap: 10px; }
.notif-sit { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; }
.notif-dot { flex: none; width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: #BDBDB9; }
.notif-sit.is-ativo .notif-dot { background: #2FBF6B; }
.notif-sit.is-bloqueado .notif-dot { background: var(--danger); }
.row > .notif-card-ico, .notif-card-ico { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; background: var(--ink); color: #fff; display: grid; place-items: center; }
.notif-card-ico svg { width: 22px; height: 22px; }
.notif-chave { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 4px 0; cursor: pointer; }
.notif-chave input { flex: none; appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line-2); position: relative; margin: 0; cursor: pointer; transition: background .15s; }
.notif-chave input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s; }
.notif-chave input:checked { background: var(--ink); }
.notif-chave input:checked::after { transform: translateX(18px); }
.notif-chave.is-off { opacity: .5; }
.card.is-off { opacity: .55; }
.notif-sem { font-weight: 400; opacity: .7; }
.notif-equipe, .notif-envios { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.notif-equipe li { display: flex; align-items: center; gap: 10px; }
.notif-equipe .r-sub.is-sem { color: var(--muted); font-style: italic; }
.notif-envios li { display: grid; gap: 2px; justify-items: start; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
.notif-envios li:last-child { border-bottom: 0; padding-bottom: 0; }
.notif-card { gap: 12px; }
@media (max-width: 440px) { .who-role { display: none; } }
.link-btn { border: 0; background: none; padding: 8px 2px; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

main {
  max-width: 1040px; margin: 0 auto;
  padding: 20px max(16px, env(safe-area-inset-right)) calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left));
}
main.no-nav { padding-bottom: 48px; }
/* Telas com largura máxima (formulários, veículo, agenda...) ficam no centro no computador. */
main > * { margin-left: auto; margin-right: auto; }
.stack { display: grid; gap: 16px; }
.stack-lg { display: grid; gap: 28px; }

h1 { margin: 0; font: 700 30px/1.05 var(--cond); letter-spacing: .01em; }
h2 { margin: 0; font: 700 21px/1.1 var(--cond); letter-spacing: .01em; }
h3 { margin: 0; font: 600 15px/1.3 var(--body); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.count { color: var(--muted); font-size: 14px; white-space: nowrap; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; color: var(--muted); font-weight: 600; font-size: 14px; }
.back svg { width: 18px; height: 18px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
/* Bloco recolhível (opções do Controle, tipos de serviço) */
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .fold-ico { display: grid; color: var(--muted); transition: transform .15s; }
details.fold > summary .fold-ico svg { width: 20px; height: 20px; }
details.fold[open] > summary .fold-ico { transform: rotate(180deg); }
details.fold { display: block; }
details.fold > * + * { margin-top: 14px; }
@media (prefers-reduced-motion: reduce) { details.fold > summary .fold-ico { transition: none; } }

/* ---------- Navegação inferior ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left));
}
.nav-in { max-width: 640px; margin: 0 auto; height: var(--nav-h); display: flex; align-items: center; justify-content: space-around; gap: 4px; }
.nav a {
  flex: 1; display: grid; justify-items: center; gap: 3px; padding: 6px 2px; border-radius: 10px;
  color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600;
}
.nav a svg { width: 22px; height: 22px; }
/* Aba aberta: fundo cinza atrás do ícone + texto em preto e negrito */
.nav a .ico { position: relative; display: grid; place-items: center; width: 56px; height: 32px; border-radius: 999px; transition: background-color .15s; }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 800; }
.nav a[aria-current="page"] .ico { background: #E4E4E1; }
.nav a.nav-scan { color: var(--primary-ink); }
.nav a.nav-scan span.pill { display: grid; place-items: center; width: 56px; height: 32px; border-radius: 999px; background: var(--primary-grad); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.nav a.nav-scan span.lbl { color: var(--muted); }
.nav a.nav-scan[aria-current="page"] span.lbl { color: var(--ink); }
.nav a.nav-scan[aria-current="page"] span.pill { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.nav a.has-alert .ico::after { content: ""; position: absolute; top: 2px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: #D97706; box-shadow: 0 0 0 2px var(--surface); }
@media (prefers-reduced-motion: reduce) { .nav a .ico { transition: none; } }

/* ---------- Formulários ---------- */
label, .label { font-weight: 600; font-size: 13px; color: var(--ink-2); }
.field { display: grid; gap: 6px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
input[type="text"], input[type="search"], input[type="password"], select, textarea {
  width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 11px 12px; font-size: 16px;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
textarea { resize: vertical; min-height: 76px; }
::placeholder { color: #9A9A98; }
.plate-input { font: 700 24px var(--cond) !important; letter-spacing: .12em; text-transform: uppercase; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface);
  font: 700 14px/1 var(--cond); letter-spacing: .03em; text-transform: uppercase; text-decoration: none; color: var(--ink);
}
.btn svg { width: 19px; height: 19px; flex: none; }
.btn--primary { background: var(--primary-grad); color: var(--primary-ink); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.16); }
.btn--danger { color: var(--danger); border-color: #EBC4BF; }
.btn--block { width: 100%; }
.btn--lg { min-height: 56px; font-size: 15.5px; }
.btn--sm { min-height: 36px; padding: 0 12px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions > .grow { flex: 1; min-width: 160px; }

.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font: 600 12px/1.4 var(--body); background: var(--soft); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag--dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.tag--warn { background: var(--warn-bg); border-color: #F1D5A3; color: var(--warn); }
.tag--danger { background: var(--danger-bg); border-color: #F2C3BD; color: var(--danger); }
.tag--ok { background: #E8F3EC; border-color: #BFDCC9; color: var(--ok); }

.alert { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--warn-bg); border: 1px solid #F1D5A3; color: var(--warn); font-size: 14px; font-weight: 500; text-decoration: none; }
.alert b { font-weight: 700; }
.alert svg { width: 18px; height: 18px; flex: none; }
.empty { margin: 0; padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 14px; background: var(--surface); }

/* ---------- Login ---------- */
.login { min-height: 100dvh; display: grid; align-content: center; justify-items: center; padding: 32px 16px; }
.login-box { width: 100%; max-width: 420px; display: grid; gap: 24px; }
.login-brand { display: grid; gap: 6px; }
.login-brand .wordmark { font-size: 30px; line-height: 1.05; white-space: normal; gap: 12px; }
.login-brand .wordmark-ico { height: 28px; }
.login-brand .wordmark-txt { height: 24px; max-width: 100%; object-fit: contain; object-position: left; }
.login-brand p { margin: 0; color: var(--muted); }
.choice {
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; color: var(--ink); text-decoration: none;
  padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
}
.choice:hover { border-color: var(--line-2); }
.choice-ico { width: 44px; height: 44px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.choice-ico svg { width: 22px; height: 22px; }
.choice-txt { display: grid; gap: 2px; flex: 1; }
.choice-txt b { font-size: 16px; }
.choice-txt span { font-size: 13px; color: var(--muted); }
.choice-go { color: var(--muted); }
.choice.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.choice.dark .choice-ico { background: #2A2A2A; border-color: #3A3A3A; }
.choice.dark .choice-txt span, .choice.dark .choice-go { color: #BDBDBD; }
.people { display: grid; gap: 8px; }
.login-note { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }

/* ---------- Galeria ---------- */
.gallery { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); }
@media (min-width: 720px) { .gallery { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; } }
.car {
  width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr; text-align: left; padding: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.car:hover { border-color: var(--line-2); }
.car-photo { aspect-ratio: 4 / 3; background: var(--soft); position: relative; overflow: hidden; }
.car-photo img { width: 100%; height: 100%; object-fit: cover; }
.car-photo .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #B5B5B2; }
.car-photo .ph svg { width: 44px; height: 44px; }
.car-body { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; }
.car-plate { font: 700 21px/1 var(--cond); letter-spacing: .08em; }
.car-opc { font-size: 12px; font-weight: 600; color: #5B3F99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag--opc { background: #F1ECFA; border-color: #DCD0F0; color: #5B3F99; }
.car-desc { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.car-stage { font-size: 13px; font-weight: 600; }
.car-model { font: 700 18px/1.1 var(--cond); letter-spacing: .03em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.car-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; font-size: 13px; color: var(--muted); }
/* Placa em miniatura no estilo Mercosul: faixa azul com "BRASIL" e a bandeira à direita. */
.car-placa { flex: none; display: inline-flex; flex-direction: column; overflow: hidden; border: 1.5px solid #1a1a1a; border-radius: 4px; background: #fff; }
.car-placa-faixa { position: relative; height: 8px; padding: 0 12px; background: #1F4FA8; color: #fff; font: 700 5.5px/8px var(--body); letter-spacing: .2em; text-align: center; }
.car-placa-bandeira { position: absolute; right: 2px; top: 1.5px; width: 7.5px; height: 5px; display: block; line-height: 0; }
.car-placa-bandeira svg { width: 100%; height: 100%; display: block; border-radius: 1px; }
.car-placa-num { padding: 3px 6px 3px; font: 700 15px/1 var(--cond); letter-spacing: .08em; color: #111; text-align: center; }
.car-meta .car-cliente { max-width: 100%; }
.car-cliente { font-size: 13px; color: var(--ink-2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.car-cliente.is-pendente { color: var(--warn); font-weight: 600; letter-spacing: .02em; }
.car-stage { border-top: 1px solid var(--line); margin-top: 2px; padding-top: 7px; }
.bar { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); }

.search { position: relative; }
.search input { padding-left: 38px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }

/* ---------- Placa ---------- */
.plate { container-type: inline-size; width: 100%; max-width: 300px; }
.plate__body { height: 34.5cqw; display: grid; grid-template-rows: minmax(0, 27fr) minmax(0, 73fr); border: .9cqw solid #151515; border-radius: 4.2cqw; overflow: hidden; background: #FAFAF8; }
.plate__band { display: grid; place-items: center; background: #1C1C1C; color: #fff; font: 600 5.4cqw/1 var(--cond); letter-spacing: .32em; padding-left: .32em; }
.plate__chars { display: grid; place-items: center; color: #151515; white-space: nowrap; font: 700 24cqw/1 var(--cond); letter-spacing: .04em; }
.plate--old .plate__body { background: #C9CBCD; }
.plate--old .plate__band { background: transparent; color: #151515; }
.plate--ghost .plate__chars { opacity: .2; }
.plate.is-reading .plate__chars { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .plate.is-reading .plate__chars { animation: none; opacity: .5; } }
.plate-center { display: grid; place-items: center; }

/* ---------- Leitor ---------- */
.frame { position: relative; overflow: hidden; border-radius: 14px; background: #000; width: min(100%, calc(46dvh * 3 / 4)); justify-self: center; aspect-ratio: 3 / 4; }
.frame video { display: block; width: 100%; height: 100%; object-fit: cover; }
.guide { position: absolute; left: 8%; width: 84%; aspect-ratio: 3.2 / 1; top: 50%; transform: translateY(-50%); border: 3px solid #fff; border-radius: 10px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5); pointer-events: none; }
.status { margin: 0; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px dashed var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 12px; font: 700 15px var(--cond); letter-spacing: .08em; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- Veículo ---------- */
.veh-head { display: grid; gap: 4px; }
/* Topo do veículo */
.veh-topo { display: grid; gap: 10px; }
.veh-hero { position: relative; overflow: hidden; border-radius: 18px; background: var(--primary-grad); color: #fff; display: flex; align-items: flex-end; min-height: 128px; }
.veh-hero.tem-foto { aspect-ratio: 16 / 10; max-height: 300px; min-height: 190px; cursor: zoom-in; }
.veh-hero-foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.veh-hero-sombra { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 35%, rgba(0, 0, 0, .82) 100%); }
.veh-hero:not(.tem-foto) .veh-hero-sombra { display: none; }
.veh-hero-txt { position: relative; z-index: 1; width: 100%; padding: 16px; display: grid; gap: 9px; }
.veh-hero-modelo { font: 800 32px/1 var(--cond); letter-spacing: .03em; text-shadow: 0 1px 12px rgba(0, 0, 0, .35); overflow-wrap: anywhere; }
.veh-hero-modelo.is-placa { letter-spacing: .08em; }
.veh-hero-linha { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.veh-hero-cliente { font-weight: 600; font-size: 15px; text-shadow: 0 1px 8px rgba(0, 0, 0, .4); }
.veh-hero-cliente.is-pendente { color: #FFC56B; letter-spacing: .02em; }
.veh-info { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
.veh-info-desc { font-size: 13px; color: var(--muted); }
.veh-plate { font: 700 38px/1 var(--cond); letter-spacing: .08em; }
.veh-sub { color: var(--muted); font-size: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; }
.step { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: start; padding: 10px 0; position: relative; }
.step + .step { border-top: 1px solid var(--line); }
.step-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; background: var(--surface); }
.step-dot svg { width: 14px; height: 14px; }
.step.is-done .step-dot { background: var(--ink); border-color: var(--ink); color: #fff; }
.step.is-current .step-dot { border-color: var(--ink); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 10px var(--ink); }
.step-main { display: grid; gap: 1px; padding-top: 2px; min-width: 0; }
.step-name { font-weight: 600; }
.step.is-todo .step-name { color: var(--muted); font-weight: 500; }
.step-when { font-size: 12px; color: var(--muted); }

.etapa-fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.photos { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }

.pres-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #BDBDB9; flex: none; }

/* Botão "Status da equipe" em Relatórios */

.hist-cta { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); text-decoration: none; min-width: 0; }

.cta-txt { flex: 1; display: grid; gap: 4px; min-width: 0; }

/* Histórico do funcionário */

.func-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }

.tl { display: grid; gap: 16px; }

.tl-veic { font-size: 12px; color: var(--muted); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-veic b { color: var(--ink-2); font: 700 12px var(--cond); letter-spacing: .06em; }
.pres-item + .pres-item { border-top: 1px solid var(--line); }
.pres-av { position: relative; flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--line); font: 700 16px/1 var(--cond); letter-spacing: .04em; color: var(--ink-2); }
.pres-item.is-online .pres-av { background: var(--ink); border-color: var(--ink); color: #fff; }
.pres-av .pres-dot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; box-shadow: 0 0 0 2.5px var(--surface); }
.pres-item.is-online .pres-av .pres-dot { animation: pres-pulso 1.6s ease-out infinite; }
.pres-item.is-fora, .pres-item.is-nunca { opacity: .62; }
.pres-main { flex: 1; display: grid; gap: 2px; min-width: 0; font-size: 15px; }
.pres-main b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pres-st { font-size: 13px; color: var(--muted); }
.pres-item.is-online .pres-st { color: var(--ok); font-weight: 600; }
.pres-item.is-parado .pres-st { color: var(--warn); font-weight: 600; }
.pres-tela { flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 5px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.pres-quando { flex: none; font-size: 12px; color: var(--muted); }
.pres-vazio { display: flex; align-items: center; gap: 10px; padding: 18px 2px; color: var(--muted); font-size: 14px; }
.pres-spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--ink); animation: girar .7s linear infinite; }
@keyframes pres-pulso { 0% { box-shadow: 0 0 0 0 rgba(47, 191, 107, .55), 0 0 0 2.5px var(--surface); } 100% { box-shadow: 0 0 0 9px rgba(47, 191, 107, 0), 0 0 0 2.5px var(--surface); } }
.pres-aovivo i { box-shadow: none; }
@media (prefers-reduced-motion: reduce) { .cta-vivo i, .pres-aovivo i, .pres-item.is-online .pres-av .pres-dot { animation: none; } }
.top-ico.girando svg { animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* ---------- Valor do serviço (Controle) ---------- */
.valor-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.valor-num { font: 700 28px/1 var(--cond); letter-spacing: .01em; }
.valor-num.vazio { font: 500 15px var(--body); color: var(--muted); }

/* ---------- Agenda ---------- */
.ag-nav { display: flex; align-items: center; gap: 6px; }
.ag-nav .arrow { width: 40px; height: 40px; flex: none; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); display: grid; place-items: center; }
.ag-nav .arrow svg { width: 18px; height: 18px; }
.ag-period { flex: 1; border: 0; background: none; font: 700 22px/1 var(--cond); text-align: center; padding: 8px 0; }
.ag-period em { font-style: normal; color: var(--muted); font-weight: 600; }
.ag-dow, .ag-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.ag-dow span { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); }
.ag-cell { position: relative; aspect-ratio: 1; border: 1px solid transparent; border-radius: 10px; background: var(--surface); display: grid; place-items: center; align-content: center; gap: 3px; padding: 0 0 6px; }
.ag-cell.out { background: none; visibility: hidden; }
@media (min-width: 720px) { .ag-cell { aspect-ratio: 16 / 10; } }
.ag-cell .n { font-size: 14px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.ag-cell.fim .n { color: var(--muted); }
/* Dia com agendamento: fundo verde claro e bolinha verde. Feriado: fundo e número em vermelho. */
.ag-cell.tem { background: #E6F4EC; border-color: #B7DEC6; }
.ag-cell.feriado { background: var(--danger-bg); border-color: #F2C3BD; }
.ag-cell.feriado .n { color: var(--danger); font-weight: 700; }
.ag-cell.rng::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--line-2); }
.ag-cell.today { border: 2px solid var(--ink); }
.ag-cell.today .n { font-weight: 700; }
.ag-cell.sel { background: var(--ink); }
.ag-cell.sel .n { color: #fff; font-weight: 700; }
.ag-dots { display: flex; gap: 3px; height: 6px; align-items: center; }
.ag-dot { width: 7px; height: 7px; border-radius: 50%; background: #1F9D55; box-shadow: 0 0 0 2px rgba(31, 157, 85, .18); }
.ag-dot.concluido { background: #9A9A98; box-shadow: none; }
.ag-dot.em_servico { background: var(--ink); box-shadow: none; }
.ag-cell.sel .ag-dot.em_servico { background: #fff; }
.ag-dot.cancelado { background: none; border: 1px solid #B5B5B2; box-shadow: none; }
.ag-cell.sel .ag-dot { background: #4ADE80; box-shadow: none; }
.ag-cell.sel .ag-dot.concluido { background: #CFCFCC; }
.ag-mais { font-size: 9px; color: var(--muted); line-height: 1; }
.ag-legenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.ag-legenda span { display: inline-flex; align-items: center; gap: 6px; }
.ag-legenda b { display: block; width: 8px; height: 8px; border-radius: 50%; }
.ag-resumo { display: flex; gap: 18px; font-size: 13px; color: var(--muted); }
.ag-resumo b { color: var(--ink); font-weight: 700; }
.ag-appt { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; text-align: left; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; }
.ag-appt .marca { grid-row: 1 / 3; width: 50px; height: 40px; border-radius: 9px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font: 700 12px var(--body); letter-spacing: .02em; color: var(--ink-2); }
.ag-appt .marca svg { width: 22px; height: 22px; color: var(--muted); }
.ag-appt .nome { font-weight: 600; }
.ag-appt .meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-appt .lado { grid-row: 1 / 3; grid-column: 3; display: flex; align-items: center; gap: 8px; }
.ag-appt.cancelado { opacity: .5; }
.ag-appt.cancelado .nome { text-decoration: line-through; }
.ag-appt.entrega { border-style: dashed; }
.wa-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #E8F3EC; color: var(--ok); }
.wa-btn svg { width: 18px; height: 18px; }
.ag-year { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.ag-mini { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: left; }
.ag-mini header { display: flex; justify-content: space-between; margin-bottom: 6px; font: 700 16px var(--cond); }
.ag-mini header i { font-style: normal; color: var(--muted); font: 600 13px var(--body); }
.ag-mg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.ag-mg span { aspect-ratio: 1; display: grid; place-items: center; font-size: 10px; color: var(--muted); border-radius: 4px; }
.ag-mg span.has { background: #D3EEDD; color: #145C33; font-weight: 700; }
.ag-mg span.hot { background: #1F9D55; color: #fff; font-weight: 700; }
.ag-mg span.fer { color: var(--danger); font-weight: 700; background: var(--danger-bg); }
.ag-mg span.today { outline: 1.5px solid var(--ink); }
.status-seg { display: flex; gap: 6px; }
.status-seg button { flex: 1; min-height: 42px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 13px; color: var(--muted); }
.status-seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
input[type="date"], input[type="tel"], input[type="number"] { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 11px 12px; font-size: 16px; min-height: 46px; }

/* ---------- Relatórios ---------- */
.rel-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.rel-kpi { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.rel-kpi b { font: 700 24px/1.1 var(--cond); }
.rel-kpi span { font-size: 12px; color: var(--muted); font-weight: 600; }
.tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabela th { text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tabela td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabela .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tabela tr:last-child td { border-bottom: 0; }
.tabela-wrap { overflow-x: auto; margin: 0 -4px; }

/* ---------- Cliente ---------- */
.client { max-width: 640px; margin: 0 auto; }
.client-hero { display: grid; gap: 8px; }
.client-hero p { margin: 0; color: var(--muted); }
.status-big { display: grid; gap: 8px; padding: 18px; border-radius: 14px; background: var(--ink); color: #fff; }
.status-big .k { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: #BDBDBD; }
.status-big .v { font: 700 30px/1.05 var(--cond); }
.status-big .bar { background: #3A3A3A; }
.status-big .bar > i { background: #fff; }

/* ---------- Diálogos e aviso ---------- */
dialog.viewer { border: 0; padding: 0; background: #000; max-width: 100vw; max-height: 100dvh; width: 100vw; height: 100dvh; }
dialog.viewer::backdrop { background: rgba(0, 0, 0, .9); }
.viewer-in { width: 100%; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.viewer-acoes { display: flex; gap: 10px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.viewer-acoes:empty { display: none; }
.viewer-acoes .btn { flex: 1; background: transparent; color: #fff; border-color: #5A5A5A; }
.viewer-acoes.is-tipos { flex-wrap: wrap; gap: 8px; }
.viewer-tipos-tit { flex-basis: 100%; color: rgba(255, 255, 255, .7); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.viewer-acoes .chip { background: transparent; color: #fff; border: 1px solid #5A5A5A; border-radius: 999px; padding: 8px 13px; font: 600 14px/1.2 var(--body); letter-spacing: 0; }
.viewer-acoes .chip.is-atual { background: #fff; color: #000; border-color: #fff; }
.viewer-acoes .viewer-tipos-cancelar { flex-basis: 100%; margin-top: 4px; }
.viewer-acoes .btn--danger { color: #FF8A80; border-color: #7A3A34; }
.step-foto.is-vazia { display: grid; place-items: center; border: 1.5px dashed var(--line-2); background: var(--surface); color: var(--muted); }
.step-foto.is-vazia svg { width: 20px; height: 20px; }
.viewer-bar { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; color: #fff; }
.viewer-bar button { border: 0; background: none; color: #fff; font-weight: 600; font-size: 15px; padding: 8px; }
/* A foto ocupa só o espaço entre a barra e os botões e cabe inteira (antes crescia até o tamanho real e cortava no PC). */
.viewer-img { position: relative; overflow: hidden; min-height: 0; }
.viewer-img img { position: absolute; inset: 0 8px; width: calc(100% - 16px); height: 100%; object-fit: contain; display: block; }
/* Câmera própria das fotos (sempre a traseira) */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92dvh; border-radius: 18px 18px 0 0; background: var(--surface); color: var(--ink); box-shadow: 0 -10px 40px rgba(0, 0, 0, .18); }
dialog.sheet::backdrop { background: rgba(0, 0, 0, .45); }
.versao-in { justify-items: center; text-align: center; }
.versao-in h2 { margin: 0; }
.versao-in .actions { width: 100%; }
.versao-ico { width: 52px; height: 52px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; }
.versao-ico svg { width: 26px; height: 26px; }
@media (min-width: 600px) { dialog.sheet { margin: auto; border-radius: 18px; } }
.sheet-in { display: grid; gap: 14px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet-tag { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 9px 14px; font: 600 14px/1.2 var(--body); }
.sheet-tag[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.sheet-in .actions .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.sheet-in .actions .btn:disabled { opacity: .45; }
dialog.cam { border: 0; padding: 0; background: #000; max-width: 100vw; max-height: 100dvh; width: 100vw; height: 100dvh; }
dialog.cam::backdrop { background: #000; }
.cam-in { width: 100%; height: 100%; display: grid; grid-template-rows: 1fr auto; }
.cam-in video { width: 100%; height: 100%; object-fit: contain; background: #000; min-height: 0; }
.cam-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 20px calc(18px + env(safe-area-inset-bottom, 0px)); }
.cam-bar button:not(.cam-shot) { border: 0; background: none; color: #fff; font-weight: 600; font-size: 15px; padding: 10px; }
.cam-bar #camera-cancel { justify-self: start; }
.cam-bar #camera-galeria { justify-self: end; }
.cam-shot { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: #fff; box-shadow: inset 0 0 0 4px #000; }
.cam-shot:active { transform: scale(.94); }
.cam-shot:disabled { opacity: .5; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  max-width: calc(100vw - 32px); padding: 12px 16px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 500;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
}
.toast.is-err { background: var(--danger); }
body.no-nav .toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Liquid glass (topo e menu inferior) ----------
   Vidro só na navegação: o conteúdo (fotos, placas, etapas) continua sólido.
   Base: github.com/stormaref/LiquidGlassSkill (CSS) + refração de liquid-glass-js (MIT), adaptadas às cores da marca. */
:root {
  --glass-tint-top: rgba(255, 255, 255, .62);
  --glass-tint-bottom: rgba(236, 236, 234, .52);
  --glass-rim-top: rgba(255, 255, 255, .85);
  --glass-rim-hairline: rgba(255, 255, 255, .35);
  --glass-rim-bottom: rgba(255, 255, 255, .25);
  --glass-border: rgba(18, 18, 18, .09);
  --glass-shadow: 0 10px 30px rgba(18, 18, 18, .14);
}
/* Fundo com leve variação de tom: o vidro precisa de algo atrás para aparecer. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(34rem 28rem at 10% 0%, rgba(255, 255, 255, .9), transparent 60%),
    radial-gradient(30rem 26rem at 100% 60%, rgba(18, 18, 18, .06), transparent 62%),
    radial-gradient(28rem 24rem at 20% 100%, rgba(160, 160, 155, .12), transparent 62%);
}
.topbar {
  background: linear-gradient(180deg, var(--glass-tint-top), var(--glass-tint-bottom));
  border-bottom: 1px solid var(--glass-border);
  box-shadow: inset 0 -1px 0 var(--glass-rim-hairline);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
}
.nav {
  left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right));
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto; padding: 0 6px; border-radius: 30px;
  background: linear-gradient(180deg, var(--glass-tint-top), var(--glass-tint-bottom));
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-rim-top), inset 0 0 0 1px var(--glass-rim-hairline), inset 0 -1px 0 var(--glass-rim-bottom);
  backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%);
}
/* Botões do topo (engrenagem e Sair): redondos, brancos, com sombra leve. */
.topbar .top-ico { padding: 0; width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, .92); border: 1px solid rgba(18, 18, 18, .08);
  box-shadow: 0 2px 8px rgba(18, 18, 18, .08), inset 0 1px 0 #fff; }
.topbar .top-ico[aria-current="page"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.nav { --glass-tint-top: rgba(255, 255, 255, .74); --glass-tint-bottom: rgba(240, 240, 238, .66); }
.nav a, .nav a.nav-scan span.lbl { color: var(--ink-2); }
.nav a[aria-current="page"] .ico { background: rgba(18, 18, 18, .08); }
.nav a.nav-scan span.pill { box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 4px 10px rgba(0,0,0,.25); }
.nav a.nav-scan[aria-current="page"] span.pill { box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 0 4px var(--ink); }
.nav a.has-alert .ico::after { box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
main { padding-bottom: calc(var(--nav-h) + 44px + env(safe-area-inset-bottom, 0px)); }
main.no-nav { padding-bottom: 48px; }
.toast { bottom: calc(var(--nav-h) + 26px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Fluidez: animações leves (só transform e opacity, que o celular desenha sem esforço) ---------- */
:root { --suave: cubic-bezier(.2, .8, .2, 1); }
/* Tela de carregamento: logo, barrinha correndo e o texto. Aparece com um pequeno atraso,
   então quem abre rápido nem chega a ver piscar. */
.carregar { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 32px 16px; text-align: center;
  animation: aparecer .35s var(--suave) .12s both; }
.carregar .wordmark-txt { height: 22px; }
.carregar-barra { width: 148px; height: 3px; border-radius: 3px; background: rgba(18, 18, 18, .1); overflow: hidden; position: relative; }
.carregar-barra::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 3px; background: var(--ink);
  animation: correr 1.1s var(--suave) infinite; }
.carregar .hint { font-size: 12.5px; letter-spacing: .02em; }
@keyframes correr { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
/* Troca de tela: o conteúdo entra subindo de leve (só quando muda de tela, não nas atualizações automáticas). */
main.entra { animation: entrar .2s ease-out both; }
@keyframes entrar { from { opacity: .5; transform: translateY(3px); } to { opacity: 1; transform: none; } }
/* Foto aberta: aviso embaixo enquanto a versão em alta qualidade baixa. Só aparece se demorar
   (atraso de 150 ms), então a foto que já está no aparelho não pisca o aviso. */
.viewer-carga { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-radius: 999px; background: rgba(0, 0, 0, .62); color: rgba(255, 255, 255, .88); font-size: 12.5px; font-weight: 500;
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s ease-out;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.viewer-carga.is-on { opacity: 1; transition-delay: .15s; }
.viewer-carga .carregar-barra { width: 56px; background: rgba(255, 255, 255, .22); }
.viewer-carga .carregar-barra::after { background: #fff; }
/* Toque: botões, cartões e linhas afundam um pouco ao pressionar. */
.btn, .car, .r, .top-ico, .nav a .ico, .nav a .pill, .link-btn, .hv-filtros button, .sheet-tag { transition: transform .12s var(--suave), background-color .15s, opacity .15s; }
.btn:not(:disabled):active, .top-ico:active, .hv-filtros button:active, .sheet-tag:active { transform: scale(.96); }
.car:active, .r:active { transform: scale(.985); }
.nav a:active .ico, .nav a:active .pill { transform: scale(.9); }
/* Janelas de baixo (sheet) sobem; o fundo escurece aos poucos. */
dialog.sheet[open] { animation: folha .28s var(--suave); }
dialog.sheet[open]::backdrop { animation: aparecer .2s ease-out; }
@keyframes folha { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
/* Aviso (toast) entra subindo. */
.toast:not([hidden]) { animation: aviso .24s var(--suave); }
@keyframes aviso { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translateX(-50%); } }
/* Foto que demorou a chegar aparece suave, em vez de "estourar" na tela. */
img.chegando { animation: aparecer .3s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .carregar, main.entra, dialog.sheet[open], dialog.sheet[open]::backdrop, .toast:not([hidden]), img.chegando { animation: none; }
  .carregar-barra::after { animation-duration: 2.4s; }
  .btn, .car, .r, .top-ico, .nav a .ico, .nav a .pill, .link-btn, .hv-filtros button, .sheet-tag { transition: none; }
}
</style>

const rtf = new Intl.RelativeTimeFormat('pt-BR', { numeric: 'auto' });

/* =====================================================================
   Placa: validação e correção (igual ao leitor anterior)
   ===================================================================== */
const RE_VALID = /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/;
const RE_OLD = /^[A-Z]{3}[0-9]{4}$/;
const RE_NEW = /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/;
const norm = s => String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7);
const isValid = p => RE_VALID.test(p);
const fmtPlaca = p => RE_OLD.test(p) ? p.slice(0, 3) + '-' + p.slice(3) : p;
const L2D = { O: '0', Q: '0', D: '0', I: '1', L: '1', Z: '2', S: '5', G: '6', B: '8' };
const D2L = { '0': 'O', '1': 'I', '2': 'Z', '5': 'S', '6': 'G', '8': 'B' };
function fixByPosition(p) {
  if (p.length !== 7) return p;
  return [...p].map((ch, i) => {
    if (i < 3) return D2L[ch] ?? ch;
    if (i === 3 || i >= 5) return L2D[ch] ?? ch;
    return ch;
  }).join('');
}
function mismatches(w) {
  let m = 0;
  for (let i = 0; i < 7; i++) {
    const isL = w[i] >= 'A' && w[i] <= 'Z', isD = w[i] >= '0' && w[i] <= '9';
    if (i < 3) { if (!isL) m++; } else if (i !== 4) { if (!isD) m++; }
  }
  return m;
}
function extractPlates(strings) {
  const out = new Map();
  for (const s of strings) {
    const t = String(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
    for (let i = 0; i + 7 <= t.length; i++) {
      const w = t.slice(i, i + 7), m = mismatches(w);
      if (m > 2) continue;
      const p = fixByPosition(w);
      if (!isValid(p)) continue;
      if (!out.has(p) || m < out.get(p)) out.set(p, m);
    }
  }
  return out;
}
function toGray(d) {
  const n = d.length / 4, g = new Uint8ClampedArray(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000;
  return g;
}
function stretch(g) {
  const h = new Uint32Array(256), n = g.length;
  for (let i = 0; i < n; i++) h[g[i]]++;
  let lo = 0, hi = 255, acc = 0;
  while (lo < 255 && (acc += h[lo]) < n * 0.02) lo++;
  acc = 0;
  while (hi > 0 && (acc += h[hi]) < n * 0.02) hi--;
  if (hi - lo < 20) return g;
  const out = new Uint8ClampedArray(n), s = 255 / (hi - lo);
  for (let i = 0; i < n; i++) out[i] = (g[i] - lo) * s;
  return out;
}
function otsu(g) {
  const h = new Uint32Array(256), n = g.length;
  for (let i = 0; i < n; i++) h[g[i]]++;
  let sum = 0; for (let t = 0; t < 256; t++) sum += t * h[t];
  let sB = 0, wB = 0, max = 0, th = 127;
  for (let t = 0; t < 256; t++) {
    wB += h[t]; if (!wB) continue;
    const wF = n - wB; if (!wF) break;
    sB += t * h[t];
    const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
    if (v > max) { max = v; th = t; }
  }
  return th;
}
function binarize(g) {
  const t = otsu(g), out = new Uint8ClampedArray(g.length);
  let dark = 0;
  for (let i = 0; i < g.length; i++) { const v = g[i] > t ? 255 : 0; out[i] = v; if (!v) dark++; }
  if (dark > g.length / 2) for (let i = 0; i < out.length; i++) out[i] = 255 - out[i];
  return out;
}

  for (let i = 0, j = 0; i < g.length; i++, j += 4) { d[j] = d[j + 1] = d[j + 2] = g[i]; d[j + 3] = 255; }
}

/* ---------- Leitura local (reserva): Tesseract no navegador ---------- */
let workerP = null;
function getWorker() {
  if (!workerP) {
    workerP = (async () => {
      // Leitor reserva: só é baixado quando a leitura pelo servidor falha.
      if (!window.Tesseract) await carregarScript('https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js').catch(() => {});
      if (!window.Tesseract) throw Object.assign(new Error('lib'), { code: 'lib' });
      const w = await Tesseract.createWorker('eng', 1, { logger: m => { if (S.onOcr) S.onOcr(m); } });
      await w.setParameters({ tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', preserve_interword_spaces: '0' });
      return w;
    })().catch(e => { workerP = null; throw e; });
  }
  return workerP;
}
function prep(src, kind, targetW, topCut = 0) {
  const sy = Math.round(src.height * topCut), sh = src.height - sy;
  const w = Math.round(targetW), h = Math.max(1, Math.round(sh * (w / src.width))), pad = 16;
  const cv = document.createElement('canvas'); cv.width = w + pad * 2; cv.height = h + pad * 2;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(src, 0, sy, src.width, sh, pad, pad, w, h);
  const img = ctx.getImageData(0, 0, cv.width, cv.height);
  let g = stretch(toGray(img.data));
  if (kind === 'otsu') g = binarize(g);
  grayToRGBA(g, img.data); ctx.putImageData(img, 0, 0);
  return cv;
}
async function readLocal(canvas, mode) {
  const w = await getWorker();
  const variants = mode === 'crop'
    ? [prep(canvas, 'otsu', 480), prep(canvas, 'gray', 480), prep(canvas, 'otsu', 480, 0.34), prep(canvas, 'gray', 480, 0.34)]
    : [prep(canvas, 'gray', Math.min(canvas.width, 1600))];
  await w.setParameters({ tessedit_pageseg_mode: mode === 'crop' ? '7' : '6' });
  const seen = new Map();
  for (const v of variants) {
    const { data } = await w.recognize(v);
    const lines = String(data.text || '').split('\n'); lines.push(lines.join(''));
    for (const [p, m] of extractPlates(lines)) {
      const s = seen.get(p) || { n: 0, m: 9, conf: 0 };
      s.n++; s.m = Math.min(s.m, m); s.conf = Math.max(s.conf, data.confidence || 0);
      seen.set(p, s);
    }
  }
  let best = null, bestScore = -Infinity;
  for (const [p, s] of seen) {
    const score = s.n * 10 - s.m * 4 + s.conf / 100;
    if (score > bestScore) { best = { p, ...s }; bestScore = score; }
  }
  if (!best) return { plate: null };
  const confidence = best.m >= 2 || (best.conf > 0 && best.conf < 50) ? 'baixa' : (best.n >= 2 && best.m === 0 ? 'alta' : 'media');
  return { plate: best.p, confidence };
}

/* ---------- Leitura principal: serviço de placas via api/read-plate (sem mudanças) ---------- */
const API_URL = 'api/read-plate';
const CODE_KEY = 'placas:codigo';
const apiError = (code, extra) => Object.assign(new Error(code), { code }, extra);
const API_NOTES = {
  no_backend: 'Sem servidor de leitura (abra pelo site publicado ou pelo servidor local).',
  not_configured: 'O servidor ainda não tem a chave do serviço de leitura.',
  network: 'Sem conexão com o servidor de leitura.',
  rate_limited: 'Limite do serviço de leitura atingido.',
  too_large: 'A imagem ficou grande demais para o serviço.',
  upstream: 'O serviço de leitura falhou.',
};
async function callApi(canvas, retried = false) {
  const image = canvas.toDataURL('image/jpeg', 0.85);
  const headers = { 'Content-Type': 'application/json' };
  const sessao = getSession(); if (sessao && sessao.token) headers.Authorization = `Bearer ${sessao.token}`; // leitor só para a equipe logada
  let code = ''; try { code = localStorage.getItem(CODE_KEY) || ''; } catch {}
  if (code) headers['x-access-code'] = code;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
  let res;
  try { res = await fetch(API_URL, { method: 'POST', headers, body: JSON.stringify({ image }), signal: ctl.signal }); }
  catch { throw apiError('network'); }
  finally { clearTimeout(timer); }
  let data = null; try { data = await res.json(); } catch {}
  if (res.status === 401 && data && data.error === 'sessao') { sessaoTerminou(); throw apiError('sessao'); }
  if (res.status === 401) {
    try { localStorage.removeItem(CODE_KEY); } catch {}
    if (!retried) {
      const typed = window.prompt('Código de acesso do leitor:');
      if (typed && typed.trim()) { try { localStorage.setItem(CODE_KEY, typed.trim()); } catch {} return callApi(canvas, true); }
    }
    throw apiError('unauthorized');
  }
  if (res.status === 501) throw apiError('not_configured');
  if (res.status === 429) throw apiError('rate_limited');
  if (res.status === 413) throw apiError('too_large');
  if (!data || res.status === 404 || res.status === 405) throw apiError('no_backend');
  if (!res.ok) throw apiError('upstream', { detail: data.error });
  return data;
}
async function readPlate(frame, crop, mode) {
  let note = '';
  try {
    const d = await callApi(frame);
    const p = fixByPosition(norm(d.plate));
    const alts = (d.alternatives || []).map(norm).filter(a => isValid(a) && a !== p).slice(0, 3);
    if (!isValid(p)) return { plate: null, alts, engine: 'api' };
    const s = Number(d.score) || 0;
    return { plate: p, alts, engine: 'api', confidence: s >= 0.85 ? 'alta' : s >= 0.6 ? 'media' : 'baixa' };
  } catch (e) {
    if (e.code === 'unauthorized' || e.code === 'sessao') throw e;
    note = API_NOTES[e.code] || API_NOTES.upstream;
  }
  const out = await readLocal(crop, mode);
  return { ...out, alts: [], engine: 'local', note };
}

/* =====================================================================
   Dados: banco online (Supabase), pelas funções em api/.
   O DB em memória tem o mesmo formato de antes. Cada mudança (commit) vira
   operações que vão para api/dados. Nada é apagado no banco: excluir só marca.
   ===================================================================== */
let DB = null;
let FOTO_BASE = '';
let carregadoEm = 0;
let versaoCarregada = null; // versão dos dados (sd_versao) que está na tela
let mudancas = 0;          // conta os commits, para não sobrescrever com dados velhos
let pendentes = 0;         // envios ainda sem resposta
let geracao = 0;           // muda quando um envio falha: descarta o que estava na fila
let fila = Promise.resolve();
const VERS = new Map();    // versão de cada atendimento no banco (evita sobrescrever outro aparelho)

async function apiJson(path, { method = 'GET', body, raw } = {}) {
  const headers = {};
  const sessao = getSession();
  if (sessao && sessao.token) headers.Authorization = `Bearer ${sessao.token}`;
  let payload;
  if (raw) { headers['Content-Type'] = 'application/octet-stream'; payload = raw; }
  else if (body !== undefined) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), raw ? 90000 : 30000);
  let res;
  try { res = await fetch(path, { method, headers, body: payload, cache: 'no-store', signal: ctl.signal }); }
  catch { throw apiError('network'); }
  finally { clearTimeout(timer); }
  let data = null; try { data = await res.json(); } catch {}
  // Sessão vencida, senha trocada ou pessoa removida: volta para o login.
  if (res.status === 401 && data && data.error === 'sessao') { sessaoTerminou(); throw apiError('sessao'); }
  if (!res.ok || !data) throw apiError((data && data.error) || (res.status === 404 ? 'no_backend' : 'server'), { status: res.status });
  return data;
}

async function buscarDados({ forcar = false } = {}) {
  const antes = mudancas;
  const d = await apiJson('/api/dados');
  // Mudou algo enquanto buscava, ou a tela não pode ser redesenhada agora: fica com o que está na tela.
  if (!forcar && (antes !== mudancas || pendentes || !podeRedesenhar())) return false;
  FOTO_BASE = d.fotoBase || '';
  if (d.versaoDados) versaoCarregada = d.versaoDados;
  const vers = new Map();
  const atendimentos = d.atendimentos.map(({ versao, ...a }) => { vers.set(a.id, versao); return { ...a, opcionais: a.opcionais || [], opcionaisFeitos: a.opcionaisFeitos || {} }; });
  const novo = { funcionarios: d.funcionarios, tipos: d.tipos, opcionais: d.opcionais || [], veiculos: d.veiculos, atendimentos, estoque: d.estoque, ajustes: d.ajustes || { limpezaDias: 30 }, agenda: d.agenda || [], lixeira: d.lixeira || [], anteriores: d.anteriores || [] };
  carregadoEm = Date.now();
  VERS.clear(); for (const [k, v] of vers) VERS.set(k, v);
  if (DB && JSON.stringify(novo) === JSON.stringify(DB)) return false; // nada mudou: mantém os mesmos objetos da tela
  DB = novo;
  return true;
}

// Compara o antes e o depois de um commit e monta as operações para o banco.
function diffOps(a, b) {
  const ops = [];
  const lista = (col, xa, xb, key = 'id', podeRemover = () => true) => {
    const ma = new Map(xa.map(x => [x[key], x]));
    const mb = new Map(xb.map(x => [x[key], x]));
    for (const [k, x] of mb) { const old = ma.get(k); if (!old || JSON.stringify(old) !== JSON.stringify(x)) ops.push({ col, acao: 'salvar', item: x }); }
    for (const [k, x] of ma) if (!mb.has(k) && podeRemover(x)) ops.push({ col, acao: 'remover', id: k });
  };
  const semFotos = xs => xs.map(({ fotos, ...r }) => r);
  const fotos = xs => xs.flatMap(at => at.fotos.map(f => ({ ...f, atendimentoId: at.id })));
  const atsDepois = new Set(b.atendimentos.map(x => x.id));
  lista('funcionarios', a.funcionarios, b.funcionarios);
  lista('tipos', a.tipos, b.tipos);
  lista('veiculos', Object.values(a.veiculos), Object.values(b.veiculos), 'placa', () => false);
  lista('itens', a.estoque.itens, b.estoque.itens);
  lista('movimentos', a.estoque.movimentos, b.estoque.movimentos, 'id', () => false);
  lista('agenda', a.agenda || [], b.agenda || []);
  lista('opcionais', a.opcionais || [], b.opcionais || []);
  lista('atendimentos', semFotos(a.atendimentos), semFotos(b.atendimentos));
  // Foto de atendimento excluído continua marcada como ativa (o atendimento inteiro fica guardado).
  const fa = new Map(fotos(a.atendimentos).map(f => [f.id, f]));
  const fotosDepois = fotos(b.atendimentos);
  // Foto que já existe e só mudou de etapa (etapas do tipo atualizadas): op própria, porque a foto não é regravada.
  // Foto que já existe e só mudou de tipo (Controle corrigiu o rótulo): também op própria.
  for (const f of fotosDepois) {
    const o = fa.get(f.id); if (!o) continue;
    if (o.etapa !== f.etapa) ops.push({ col: 'fotos', acao: 'etapa', id: f.id, etapa: Number.isInteger(f.etapa) ? f.etapa : null });
    if (o.rotulo !== f.rotulo) ops.push({ col: 'fotos', acao: 'rotulo', id: f.id, rotulo: f.rotulo });
    if ((o.opcional || null) !== (f.opcional || null)) ops.push({ col: 'fotos', acao: 'opcional', id: f.id, opcional: f.opcional || null });
  }
  lista('fotos', [...fa.values()], fotosDepois.map(f => { const o = fa.get(f.id); if (!o) return f; const r = { ...f, etapa: o.etapa, rotulo: o.rotulo }; if (o.opcional) r.opcional = o.opcional; else delete r.opcional; return r; }), 'id', f => atsDepois.has(f.atendimentoId));
  return ops;
}

const ERROS_SALVAR = {
  conflito: 'Este veículo foi alterado em outro aparelho. Os dados foram atualizados: confira e faça de novo.',
  placa_em_andamento: 'Esta placa já tem um serviço em andamento.',
  network: 'Sem internet. A última alteração não foi salva.',
  proibido: 'Só o Controle pode fazer isso.',
  usuario_em_uso: 'Esse usuário já existe. Escolha outro.',
  lixeira_vencida: 'Passou de 48 horas na lixeira. Não dá mais para restaurar.',
};
// Envia as operações na ordem. Se falhar: avisa, descarta a fila e recarrega do banco.
function enviar(ops, { redesenhar: redraw = true } = {}) {
  const gen = geracao;
  pendentes++;
  const p = fila.then(async () => {
    if (gen !== geracao) return false;
    for (const op of ops) if (op.col === 'atendimentos' && op.acao === 'salvar') op.versao = VERS.has(op.item.id) ? VERS.get(op.item.id) : null;
    const r = await apiJson('/api/dados', { method: 'POST', body: { ops } });
    for (const [id, v] of Object.entries(r.versoes || {})) VERS.set(id, v);
    return true;
  }).catch(async e => {
    if (e && e.code === 'sessao') return false; // já voltou para o login
    if (e && e.versoes) for (const [id, v] of Object.entries(e.versoes)) VERS.set(id, v);
    geracao++;
    toast(ERROS_SALVAR[e && e.code] || 'Não foi possível salvar. Os dados foram recarregados.', true);
    try { await buscarDados({ forcar: true }); } catch { carregadoEm = 0; } // sem internet: busca de novo na próxima chance
    if (redraw) redesenhar();
    return false;
  }).finally(() => { pendentes--; });
  fila = p;
  return p;
}
// Aplica uma mudança na tela na hora e envia para o banco em seguida.
function commit(fn) {
  const antes = JSON.parse(JSON.stringify(DB));
  fn();
  mudancas++;
  const ops = diffOps(antes, DB);
  if (ops.length) enviar(ops);
  return true;
}
// Igual ao commit, mas espera o banco confirmar (usado ao iniciar um serviço).
async function commitAgora(fn) {
  const antes = JSON.parse(JSON.stringify(DB));
  fn();
  mudancas++;
  const ops = diffOps(antes, DB);
  return ops.length ? enviar(ops, { redesenhar: false }) : true;
}

// Só troca os dados em segundo plano quando dá para redesenhar a tela sem atrapalhar quem está usando.
function podeRedesenhar() {
  const [r] = parts();
  if (['placa', 'novo', 'ajustes', 'relatorios'].includes(r)) return false;
  if (r === 'agenda' && parts()[1]) return false; // formulário de agendamento aberto
  if (r === 'estoque' && S.stockOpen) return false;
  if (S.ocupado) return false;
  if (r === 'veiculo' && (S.entradaEdit || S.valorAberto || S.marcandoEtapas)) return false; // editando estado na entrada, valor ou etapas
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== 'search') return false;
  return !$('viewer').open;
}
function redesenhar() {
  const y = window.scrollY;
  route({ manterScroll: true });
  window.scrollTo(0, y);
}
// Busca de novo no banco se os dados tiverem mais que maxIdade. O normal é buscar só quando o aviso de
// presença (a cada 20 s) disser que a versão dos dados mudou; esta busca por tempo é só uma reserva.
async function atualizarSeVelho(maxIdade = 15 * 60e3) { // reserva: o normal é o aviso de versão (versaoDados)
  if (!DB || pendentes || document.hidden || Date.now() - carregadoEm < maxIdade) return;
  if (MODO_CLIENTE || !(getSession() || {}).token) return;
  // Tela que não pode ser redesenhada agora: nem baixa (seria jogado fora). Ao sair dela, o próximo aviso busca.
  if (!podeRedesenhar()) return;
  try { if (await buscarDados()) redesenhar(); } catch {}
}
setInterval(() => atualizarSeVelho(), 60e3);

/* ---------- Fotos (Storage do Supabase) ---------- */
const fotoId = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
const fotoSrc = (f, mini = false) => f && f.caminho && FOTO_BASE ? FOTO_BASE + (mini && f.miniatura ? f.miniatura : f.caminho) : '';
function photoImg(f, alt, mini = true) {

  // Foto que já estava guardada no aparelho aparece na hora; só a que demorou entra com fade.
  return el('img', { alt: alt || '', decoding: 'async', loading: 'lazy', src: src || null, onload: e => { if (Date.now() - t0 > 150) e.currentTarget.classList.add('chegando'); } });

// Envia a foto (e uma miniatura para as listas). Devolve { id, caminho, miniatura }.
async function enviarFoto(blob) {
  const id = fotoId();
  const mini = compress(blob, 480, 0.72)
    .then(m => apiJson(`/api/foto?id=${id}&tipo=mini`, { method: 'POST', raw: m }))
    .then(r => r.caminho, () => null); // sem miniatura, as listas usam a foto normal
  const { caminho } = await apiJson(`/api/foto?id=${id}&tipo=foto`, { method: 'POST', raw: blob });
  return { id, caminho, miniatura: await mini };
}
// Envia várias fotos, 3 de cada vez. Devolve na mesma ordem.
async function enviarFotos(blobs, aoEnviar) {
  const out = new Array(blobs.length);
  let prox = 0, feitas = 0;
  const trabalho = async () => {
    while (prox < blobs.length) { const i = prox++; out[i] = await enviarFoto(blobs[i]); aoEnviar && aoEnviar(++feitas); }
  };
  await Promise.all(Array.from({ length: Math.min(3, blobs.length) }, trabalho));
  return out;
}

/* ---------- Dados antigos deste aparelho (antes do banco) ----------
   Ficam guardados no navegador; nada é apagado. Em Ajustes o Controle pode enviá-los ao banco. */
const DKEY_ANTIGO = 'sd:dados:v1';
const IMPORTADO_KEY = 'sd:dados:v1:enviado';
function dadosAntigos() {

  } catch {}

}
let idbP = null;
function idb() {
  if (!idbP) idbP = new Promise((res, rej) => {

async function fotoAntiga(id) {

}
async function compress(fileOrBlob, max = 1280, q = 0.8) { // foto: 1280 px, JPEG 0,8 (uns 200 KB)
  const url = URL.createObjectURL(fileOrBlob);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.naturalWidth * sc)); cv.height = Math.max(1, Math.round(img.naturalHeight * sc));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await canvasBlob(cv, q);
  } finally { URL.revokeObjectURL(url); }
}
const canvasBlob = (cv, q = 0.82) => new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', q));

// Abre a câmera do aparelho (padrão) ou a galeria, conforme a escolha acima da grade de fotos.
function escolherArquivo(id) {
  return new Promise(resolve => {
    const inp = $(id);
    inp.value = '';
    inp.onchange = () => resolve(inp.files && inp.files[0] ? inp.files[0] : null);
    inp.click();
  });
}
// "Tirar foto" usa a câmera própria do sistema (pede a traseira direto). No Android o app de câmera
// às vezes abria na frontal. Se o navegador não liberar a câmera, cai no app de câmera do aparelho.
async function pickPhoto(origem = 'camera') {
  if (origem !== 'galeria' && canLive()) {
    const r = await fotoPelaCamera();
    if (r !== undefined) return r; // Blob da foto, arquivo da galeria ou null (cancelou)
  }
  return escolherArquivo(origem === 'galeria' ? 'file-photo' : 'file-cam');
}
// Devolve: Blob (foto), File (escolheu na galeria), null (cancelou) ou undefined (câmera indisponível).
let camAberta = false; // evita abrir a câmera duas vezes (toque duplo)
function fotoPelaCamera() {
  return new Promise(async resolve => {
    if (camAberta) { resolve(null); return; }
    camAberta = true;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1920 } }, audio: false });
    } catch (e) {
      camAberta = false;
      if (e && e.name === 'NotAllowedError') toast('Permita a câmera nas configurações do navegador para tirar fotos direto aqui.', true);
      resolve(undefined); return;
    }
    const d = $('camera'), v = $('camera-video'), shot = $('camera-shot');
    let fechado = false;
    const fechar = r => {
      if (fechado) return; fechado = true; camAberta = false;
      stream.getTracks().forEach(t => t.stop()); v.srcObject = null;
      document.removeEventListener('visibilitychange', aoSair);
      if (d.open) { if (d.close) d.close(); else d.removeAttribute('open'); }
      resolve(r);
    };
    const aoSair = () => { if (document.hidden) fechar(null); };
    document.addEventListener('visibilitychange', aoSair);
    v.srcObject = stream;
    shot.disabled = false;
    shot.onclick = async () => {
      if (!v.videoWidth) return;
      shot.disabled = true;
      const cv = document.createElement('canvas'); cv.width = v.videoWidth; cv.height = v.videoHeight;
      cv.getContext('2d').drawImage(v, 0, 0);
      try { fechar(await canvasBlob(cv, 0.9)); } catch { fechar(null); }
    };
    $('camera-cancel').onclick = () => fechar(null);
    // Galeria: o seletor de arquivo precisa abrir no mesmo toque, antes de fechar a câmera.
    $('camera-galeria').onclick = () => { const p = escolherArquivo('file-photo'); fechar(p); };
    d.oncancel = e => { e.preventDefault(); fechar(null); }; // botão voltar do Android
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
    try { await v.play(); } catch {}
  });
}

/* ---------- Regras ---------- */
const ROTULOS = ['Frente', 'Traseira', 'Lateral esquerda', 'Lateral direita', 'Placa', 'Acessórios'];
const ROTULOS_EXTRA = ['Danos', 'Interior', 'Objetos pessoais', 'Outra'];
const tipoById = id => DB.tipos.find(t => t.id === id);
const funcById = id => DB.funcionarios.find(f => f.id === id);

const ativoDaPlaca = p => DB.atendimentos.find(a => a.placa === p && !a.concluido);
const atendimentosDaPlaca = p => DB.atendimentos.filter(a => a.placa === p).sort((a, b) => b.criadoEm - a.criadoEm);

// recentes; os antigos chegam resumidos em DB.anteriores (o Controle recebe tudo em DB.atendimentos).
function passagensDaPlaca(p) {
  const ats = atendimentosDaPlaca(p), ant = (DB.anteriores || []).find(x => x.placa === p);
  return {

    ultimoEm: Math.max(ats[0] ? ats[0].criadoEm : 0, ant ? ant.ultimoEm || 0 : 0) || null,
    clienteNome: (ats.find(a => a.clienteNome) || {}).clienteNome || (ant && ant.clienteNome) || '',
  };
}
const NOME_PENDENTE = 'NOME PENDENTE';
// Opcionais (ex.: carpete): lista de Ajustes (DB.opcionais) marcada em cada atendimento (at.opcionais, nomes).
const opcionaisDe = at => Array.isArray(at.opcionais) ? at.opcionais : [];
// Opcional também é etapa: concluído com foto (at.opcionaisFeitos = { nome: data }), aparece no fim da lista de etapas
// (pequeno, roxo) e o serviço só termina com as etapas e os opcionais feitos. Pode ser feito a qualquer hora.
const opcFeitos = at => at.opcionaisFeitos && typeof at.opcionaisFeitos === 'object' ? at.opcionaisFeitos : {};
const opcPendentes = at => opcionaisDe(at).filter(n => opcFeitos(at)[n] == null);
const etapasCompletas = at => at.etapas.every((_, i) => etapaFeita(at, i));
function talvezConcluir(at) {
  if (at.concluido || !etapasCompletas(at) || opcPendentes(at).length) return;
  at.concluido = true; at.concluidoEm = Date.now(); registrar(at, 'Serviço concluído');
}
function concluirOpcional(at, nome, texto) {
  at.opcionaisFeitos = { ...opcFeitos(at), [nome]: Date.now() };
  registrar(at, texto || `Opcional concluído: ${nome}`);
  talvezConcluir(at);
}
// Botões de marcar/desmarcar. Mostra também o que o veículo tem e saiu da lista de Ajustes.
function chipsOpcionais(marcados, aoTrocar) {
  const nomes = [...(DB.opcionais || []).map(o => o.nome), ...marcados.filter(n => !(DB.opcionais || []).some(o => o.nome === n))];
  return el('div', { class: 'sheet-tags', role: 'group', 'aria-label': 'Opcionais' }, nomes.map(n =>
    el('button', { class: 'sheet-tag', type: 'button', 'aria-pressed': String(marcados.includes(n)), onclick: () => aoTrocar(n, !marcados.includes(n)) }, n)));
} // atendimento sem nome do cliente (o nome é opcional na entrada)
// Etapas todas feitas e opcional pendente: a "etapa atual" é o opcional.
const etapaAtual = at => at.concluido ? 'Concluído' : etapasCompletas(at) && opcPendentes(at).length ? (opcPendentes(at).length === 1 ? opcPendentes(at)[0] : `${opcPendentes(at).length} opcionais`) : at.etapas[at.etapaIndex];
// Etapa feita: antes da atual ou com data. Etapa nova colocada no meio da lista (Ajustes) fica pendente
// mesmo com as seguintes já feitas.
const etapaFeita = (at, i) => at.concluido || i < at.etapaIndex || at.feitas[i] != null;
// Ordem livre por etapa (livres[i]). Etapas livres vizinhas formam um bloco: dentro dele, qualquer ordem;
// a etapa seguinte (não livre) só libera quando o bloco inteiro estiver feito.
const livresDe = x => x.etapas.map((_, i) => !!(x.livres || [])[i]);
// Foto por etapa (Ajustes): true = foto opcional ao concluir. Padrão: obrigatória.
const semFotoDe = x => x.etapas.map((_, i) => !!(x.semFoto || [])[i]);
// A etapa i do veículo exige foto? Vale o que está no tipo de serviço agora (ligado pelo nome da etapa).
function fotoObrigatoria(at, i) {
  const t = DB && DB.tipos.find(x => x.id === at.tipoId);
  if (!t) return true;
  const k = t.etapas.findIndex(n => nomeEtapa(n) === nomeEtapa(at.etapas[i]));
  return k < 0 || !semFotoDe(t)[k];
}
function etapaLiberada(at, i) {
  if (at.concluido || etapaFeita(at, i)) return false;
  const k = at.etapaIndex; if (i === k) return true;
  if (i < k) return false;
  for (let j = k; j <= i; j++) if (!(at.livres || [])[j]) return false;

}
const liberadas = at => at.etapas.map((_, i) => i).filter(i => etapaLiberada(at, i));
// Texto do andamento no card e no veículo. Uma etapa liberada: "Em <etapa>". Bloco livre com várias
// liberadas: só a quantidade que falta, para não juntar todos os nomes.
function textoEtapa(at) {
  if (at.concluido) return 'Concluído';
  const pend = opcPendentes(at);
  if (pend.length && etapasCompletas(at)) return pend.length === 1 ? `Em ${pend[0].toLowerCase()}` : `Faltam ${pend.length} opcionais`;
  const l = liberadas(at);
  if (l.length > 1) { const n = at.etapas.filter((_, i) => !etapaFeita(at, i)).length; return `Faltam ${n} etapas`; }
  return `Em ${at.etapas[l.length ? l[0] : at.etapaIndex].toLowerCase()}`;
}
const progresso = at => at.concluido ? 1 : (at.etapas.filter((_, i) => etapaFeita(at, i)).length + opcionaisDe(at).length - opcPendentes(at).length) / ((at.etapas.length + opcionaisDe(at).length) || 1);

  return at.fotos.find(x => x.rotulo === 'Frente') || at.fotos.find(x => x.rotulo !== 'Placa') || at.fotos[0] || null;
}
function registrar(at, texto) {
  const u = me();

}
// Conclui a etapa idx (padrão: a atual). Na ordem livre pode ser qualquer etapa pendente: ela fica feita e a
// "atual" continua sendo a primeira pendente. Concluir a atual pula as que já estavam feitas.
function concluirEtapa(at, idx = at.etapaIndex, texto) {
  const nome = at.etapas[idx];
  at.feitas[idx] = Date.now();
  registrar(at, texto || `${nome} concluída`);
  if (idx !== at.etapaIndex) return;
  at.etapaIndex++;
  while (at.etapaIndex < at.etapas.length && at.feitas[at.etapaIndex] != null) at.etapaIndex++; // pula as que já estavam feitas
  if (at.etapaIndex >= at.etapas.length) { at.etapaIndex = at.etapas.length - 1; talvezConcluir(at); } // com opcional pendente, ainda não termina
}
// Controle marca e desmarca quais etapas estão feitas, em qualquer ordem e sem foto. Marcada continua com a data
// que já tinha (ou agora); desmarcada perde a data (as fotos ficam). Todas marcadas: serviço concluído; alguma
// desmarcada num concluído: reabre. A atual passa a ser a primeira não marcada.
function ajustarEtapas(at, marcadas, opcMarcados = new Set(opcionaisDe(at).filter(n => opcFeitos(at)[n] != null))) {
  const now = Date.now(), feitas = {}, mudou = [], of = {};
  at.etapas.forEach((nome, i) => {
    const era = etapaFeita(at, i), fica = marcadas.has(i);
    if (fica) feitas[i] = at.feitas[i] != null ? at.feitas[i] : (era ? at.criadoEm : now);
    if (fica !== era) mudou.push(`${nome} ${fica ? 'concluída' : 'desmarcada'}`);
  });
  opcionaisDe(at).forEach(nome => {
    const era = opcFeitos(at)[nome] != null || !!at.concluido, fica = opcMarcados.has(nome);
    if (fica) of[nome] = opcFeitos(at)[nome] != null ? opcFeitos(at)[nome] : now;
    if (fica !== era) mudou.push(`${nome} ${fica ? 'concluído' : 'desmarcado'}`);
  });
  if (!mudou.length) return false;
  const idx = at.etapas.findIndex((_, i) => !marcadas.has(i));
  at.feitas = feitas; at.opcionaisFeitos = of;
  if (idx < 0 && opcionaisDe(at).every(n => opcMarcados.has(n))) { at.concluido = true; at.concluidoEm = at.concluidoEm || now; at.etapaIndex = at.etapas.length - 1; }
  else { at.concluido = false; at.concluidoEm = null; at.etapaIndex = idx < 0 ? at.etapas.length - 1 : idx; }
  registrar(at, `Etapas ajustadas pelo Controle (sem foto): ${mudou.join(', ')}`);
  if (at.concluido) registrar(at, 'Serviço concluído');
