}
// Etapas do tipo mudaram em Ajustes: os serviços em andamento desse tipo passam a seguir a lista nova.
// O que já foi feito continua feito (ligado pelo nome da etapa), com a data e a foto de cada etapa.
// Foto de etapa que saiu da lista vira foto comum (continua no veículo). Concluídos não mudam.
const nomeEtapa = s => String(s).trim().toLowerCase();
/* Põe o veículo na lista de etapas do tipo t. O que já foi feito continua feito:
   - etapa com o mesmo nome (ex.: Inspeção nos dois tipos) vira uma só, com a data e as fotos;
   - etapa feita que o tipo não tem (veio de outro tipo de serviço, ou saiu do tipo depois de feita) continua no
     veículo como feita, logo depois da etapa que vinha antes dela (marcada como livre, para nunca segurar as outras);
   - etapa que não tinha sido feita e não existe no tipo sai.
   Devolve true se a lista mudou. */
function aplicarTipo(at, t) {
  const usadas = new Set(), lista = t.etapas.map((nome, j) => {
    const i = at.etapas.findIndex((n, k) => !usadas.has(k) && nomeEtapa(n) === nomeEtapa(nome));
    if (i >= 0) usadas.add(i);
    return { nome, de: i, livre: livresDe(t)[j], extra: false };
  });
  // Feitas que o tipo não tem: entram depois da anterior na lista velha (ou no começo, se não houver).
  at.etapas.forEach((nome, i) => {
    if (usadas.has(i) || !etapaFeita(at, i)) return;
    let pos = 0;
    for (let k = i - 1; k >= 0; k--) { const p = lista.findIndex(x => x.de === k); if (p >= 0) { pos = p + 1; break; } }
    lista.splice(pos, 0, { nome, de: i, livre: true, extra: true });
  });
  const novas = lista.map(x => x.nome), feitas = {}, mapa = new Map();
  lista.forEach((x, j) => { if (x.de < 0) return; mapa.set(x.de, j); if (etapaFeita(at, x.de)) feitas[j] = at.feitas[x.de] != null ? at.feitas[x.de] : at.criadoEm; });
  let idx = novas.findIndex((_, j) => feitas[j] == null);
  if (idx < 0) { // tudo feito: a última etapa do tipo fica como atual (o Controle conclui)
    for (idx = lista.length - 1; idx > 0 && lista[idx].extra; idx--);
    delete feitas[idx];
  }
  for (const f of at.fotos) if (eFotoDeEtapa(f)) f.etapa = mapa.has(f.etapa) ? mapa.get(f.etapa) : null;
  at.fotos.forEach(f => { if (f.etapa === null) delete f.etapa; });
  const mudouLista = JSON.stringify(at.etapas) !== JSON.stringify(novas);
  at.etapas = novas; at.feitas = feitas; at.etapaIndex = idx; at.livres = lista.map(x => x.livre);
  return mudouLista;
}
// Veículo em andamento que não está igual ao que o tipo daria (aplicarTipo numa cópia mudaria algo).
function foraDoTipo(t) {
  return DB.atendimentos.filter(a => {
    if (a.tipoId !== t.id || a.concluido || !t.etapas.length) return false;
    const c = JSON.parse(JSON.stringify(a)); aplicarTipo(c, t);
    return JSON.stringify([c.etapas, c.livres]) !== JSON.stringify([a.etapas, livresDe(a)]);
  });
}
// Controle troca o tipo de serviço de um veículo em andamento (ex.: Limpeza Geral para Restauração completa).
function trocarTipo(at, t) {
  const antigo = at.tipoNome || 'sem tipo';
  aplicarTipo(at, t);
  at.tipoId = t.id; at.tipoNome = t.nome;
  registrar(at, `Tipo de serviço trocado: ${antigo} para ${t.nome}`);
}
function renomearEtapaNosVeiculos(t, antigo, novo) {
  for (const at of DB.atendimentos.filter(a => a.tipoId === t.id && !a.concluido)) {
    const k = at.etapas.findIndex(n => nomeEtapa(n) === nomeEtapa(antigo));
    if (k < 0) continue;
    at.etapas[k] = novo;
    for (const f of at.fotos) if (f.etapa === k && f.rotulo === antigo) f.rotulo = novo;
    registrar(at, `Etapa renomeada: ${antigo} para ${novo}`);
  }
}
function sincronizarEtapas(t) {
  for (const at of foraDoTipo(t)) if (aplicarTipo(at, t)) registrar(at, `Etapas atualizadas pelo tipo de serviço (${t.nome})`);
}
// Renomear o tipo de serviço: troca o nome em todos os veículos desse tipo (em serviço e concluídos, para os
// relatórios não separarem o mesmo serviço em dois) e nos agendamentos ainda "agendado" com o nome antigo.
function renomearTipo(t, novo) {
  const antigo = t.nome;
  t.nome = novo;
  for (const at of DB.atendimentos.filter(a => a.tipoId === t.id && a.tipoNome !== novo)) {
    at.tipoNome = novo;
    if (!at.concluido) registrar(at, `Tipo de serviço renomeado: ${antigo} para ${novo}`);
  }
  for (const ag of DB.agenda || []) if (ag.status === 'agendado' && nomeEtapa(ag.servico || '') === nomeEtapa(antigo)) ag.servico = novo;
}

/* ---------- Estoque: o saldo é sempre a soma dos movimentos ---------- */
function saldo(itemId) {
  return round2(DB.estoque.movimentos.filter(m => m.itemId === itemId).reduce((s, m) => s + m.delta, 0));
}
function situacao(item) {
  const s = saldo(item.id);
  if (s < 0) return { k: 'neg', txt: 'Saldo negativo', cls: 'tag--danger' };
  // Material que nunca teve movimento (recém-cadastrado) não gera aviso.
  if (s === 0) return DB.estoque.movimentos.some(m => m.itemId === item.id) ? { k: 'out', txt: 'Sem estoque', cls: 'tag--danger' } : { k: 'ok', txt: '', cls: '' };
  if (item.minimo > 0 && s <= item.minimo) return { k: 'low', txt: 'Acabando', cls: 'tag--warn' };
  return { k: 'ok', txt: '', cls: '' };
}
const itensEmAlerta = () => DB.estoque.itens.filter(it => situacao(it).k !== 'ok');
function movimentar(itemId, tipo, delta, obs) {
  const u = me();
  DB.estoque.movimentos.push({ id: uid(), itemId, tipo, delta: round2(delta), obs: obs || '', porId: u ? u.id : null, porNome: u ? u.nome : '', em: Date.now() });
}

/* =====================================================================
   Sessão: login com usuário e senha (api/login). O token fica neste aparelho.
   A página do cliente é separada: /cliente (sem login).
   ===================================================================== */
const MODO_CLIENTE = /^\/cliente\/?$/.test(location.pathname);
const SKEY = 'sd:sessao:v2';
function getSession() { try { return JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch { return null; } }
function setSession(s) { try { if (s) localStorage.setItem(SKEY, JSON.stringify(s)); else localStorage.removeItem(SKEY); } catch {} }
function me() {
  const s = getSession(); if (!s || !s.token) return null;
  const f = DB && funcById(s.id); if (!f) return null;
  return { tipo: f.nivel, id: f.id, nome: f.nome };
}
const isCtrl = () => { const u = me(); return !!u && u.tipo === 'controle'; };
function esquecerDados() { DB = null; VERS.clear(); geracao++; carregadoEm = 0; versaoCarregada = null; }
function sair() { avisarPresenca({ saiu: true }); const t = (getSession() || {}).token; if (t) desativarNotificacoes({ token: t }); notifConferida = false; try { localStorage.removeItem(NKEY); } catch {} setSession(null); esquecerDados(); S.pending = null; $('toast').hidden = true; go('#/'); }
function sessaoTerminou() {
  if (!getSession()) return;
  notifConferida = false;
  setSession(null); esquecerDados();

/* =====================================================================
   App na tela inicial (PWA). Só no acesso interno; o cliente continua como site.
   Android: usa o pedido de instalação do navegador. iPhone: mostra o passo a passo do Safari.
   ===================================================================== */
const appInstalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const eIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IKEY = 'sd:instalar:fechado';
let pedidoInstalar = null;
if (!MODO_CLIENTE) {
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; });
  addEventListener('appinstalled', () => {
    pedidoInstalar = null;
    document.querySelectorAll('.js-instalar').forEach(n => n.remove());
    toast('App instalado. Agora é só abrir pela tela inicial.');
  });
  if ('serviceWorker' in navigator && window.isSecureContext) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
/* =====================================================================
   Notificações no celular (Web Push, api/notificacoes). Cada pessoa ativa no próprio aparelho
   (cartão no Início ou tocando no nome, no topo). Android: Chrome, no site ou no app. iPhone: só com o
   app na tela inicial (iOS 16.4 ou mais novo). O Controle configura em Ajustes > Notificações.
   ===================================================================== */
const NKEY = 'sd:notif:fechado';
const pushSuportado = () => !MODO_CLIENTE && window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const nomeAparelho = () => { const ua = navigator.userAgent;
  return (eIOS() ? 'iPhone' : /android/i.test(ua) ? 'Android' : /windows/i.test(ua) ? 'Computador (Windows)' : /mac/i.test(ua) ? 'Computador (Mac)' : 'Aparelho') + (appInstalado() ? ' · app' : ''); };
const bytesB64u = s => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); return Uint8Array.from(b, ch => ch.charCodeAt(0)); };
async function swPronto() {
  return Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('sw')), 8000))]);
}
async function inscricaoAtual() {
  if (!pushSuportado()) return null;
  try { const reg = await navigator.serviceWorker.getRegistration(); return reg ? await reg.pushManager.getSubscription() : null; } catch { return null; }
}
// Situação deste aparelho: 'ativo', 'inativo', 'bloqueado', 'iphone' (precisa instalar) ou 'sem' (navegador não tem).
async function situacaoNotif() {
  if (!pushSuportado()) return eIOS() && !appInstalado() ? 'iphone' : 'sem';
  if (Notification.permission === 'denied') return 'bloqueado';
  return Notification.permission === 'granted' && await inscricaoAtual() ? 'ativo' : 'inativo';
}
const TEXTO_NOTIF = {
  ativo: 'Ativadas neste aparelho.',
  inativo: 'Desativadas neste aparelho.',
  bloqueado: 'Bloqueadas no navegador. Libere em Configurações > Notificações do navegador e tente de novo.',
  iphone: 'No iPhone, instale o app na tela inicial (Usar como app) e abra por ele para ativar.',
  sem: 'Este navegador não recebe notificações.',
};
async function ativarNotificacoes() {
  const sit = await situacaoNotif();
  if (sit === 'iphone' || sit === 'sem' || sit === 'bloqueado') { toast(TEXTO_NOTIF[sit], true); return false; }
  const perm = await Notification.requestPermission(); // precisa vir de um toque
  if (perm !== 'granted') { toast(perm === 'denied' ? TEXTO_NOTIF.bloqueado : 'Notificações não ativadas.', true); return false; }
  try {
    const { chave } = await apiJson('/api/notificacoes');
    const reg = await swPronto();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytesB64u(chave) }); }
      catch { const velha = await reg.pushManager.getSubscription(); if (velha) await velha.unsubscribe(); sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytesB64u(chave) }); }
    }
    await apiJson('/api/notificacoes', { method: 'POST', body: { acao: 'inscrever', inscricao: sub.toJSON(), aparelho: nomeAparelho() } });
    try { localStorage.setItem(NKEY, '1'); } catch {}
    return true;
  } catch (e) { toast(e && e.code === 'network' ? 'Sem internet. Tente de novo.' : 'Não deu para ativar as notificações agora.', true); return false; }
}
async function desativarNotificacoes({ token } = {}) {
  const sub = await inscricaoAtual(); if (!sub) return;
  const t = token || (getSession() || {}).token;
  // keepalive: também funciona ao sair do sistema (a sessão some logo em seguida).
  try { await fetch('/api/notificacoes', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${t}` }, body: JSON.stringify({ acao: 'sair', endpoint: sub.endpoint }) }); } catch {}
  try { await sub.unsubscribe(); } catch {}
}
// Ao abrir o sistema: aparelho que já recebe confirma que é da pessoa logada (mesmo celular, outra pessoa).
let notifConferida = false;
async function conferirNotificacoes() {
  if (notifConferida || !me() || !pushSuportado() || Notification.permission !== 'granted') return;
  notifConferida = true;
  const sub = await inscricaoAtual(); if (!sub) return;
  apiJson('/api/notificacoes', { method: 'POST', body: { acao: 'inscrever', inscricao: sub.toJSON(), aparelho: nomeAparelho() } }).catch(() => {});
}
async function testarNotificacao() {
  try { const r = await apiJson('/api/notificacoes', { method: 'POST', body: { acao: 'testar' } }); toast(r.entregues ? 'Teste enviado. Deve chegar em instantes.' : 'Nenhum aparelho ativo para receber o teste.', !r.entregues); }

/* =====================================================================
   Tela: novo atendimento (entrada do veículo)
   ===================================================================== */
function renderNew(placaRaw) {
  const placa = norm(placaRaw);
  if (!isValid(placa)) return go('#/placa');
  const existente = ativoDaPlaca(placa);
  if (existente) return go(`#/veiculo/${esc(existente.id)}`);
  const v = DB.veiculos[placa] || {};
  const anteriores = passagensDaPlaca(placa);
  const fotos = []; // {rotulo, blob, url}
  if (S.pending && S.pending.placa === placa && S.pending.blob) {
    fotos.push({ rotulo: 'Placa', blob: S.pending.blob, url: URL.createObjectURL(S.pending.blob) });
  }
  S.pending = null;
  // Entrada vinda da agenda: cliente, serviço, veículo e valor já vêm do agendamento.
  const agAberto = agendaEmEntrada(), ag0 = agAberto;

  // Nome do cliente: do agendamento ou do último serviço desta placa.
  const fCliente = el('input', { id: 'f-cliente', type: 'text', maxlength: '80', placeholder: 'Ex.: João da Silva', autocomplete: 'off', autocapitalize: 'words', value: ag0 ? ag0.cliente : anteriores.clienteNome });
  const fDesc = el('input', { id: 'f-desc', type: 'text', maxlength: '80', placeholder: 'Ex.: Fiat Strada branca 2022', value: v.descricao || (ag0 ? ag0.marca : '') });
  const tiposOk = DB.tipos.filter(t => t.etapas.length);
  const servAg = ag0 ? ag0.servico.toLowerCase() : '';
  const tipoAg = servAg ? tiposOk.find(t => servAg.includes(t.nome.toLowerCase())) : null;
  // Sem escolha automática: o tipo define as etapas, então precisa ser escolhido (só vem pronto se o agendamento bater).
  const fTipo = el('select', { id: 'f-tipo', required: true },
    el('option', { value: '', disabled: true, selected: !tipoAg }, 'Escolha o tipo de serviço'),
    tiposOk.map(t => el('option', { value: t.id, selected: tipoAg && t.id === tipoAg.id }, t.nome)));
  const fDanos = el('textarea', { id: 'f-danos', rows: '3', maxlength: '1000', placeholder: 'Riscos, amassados, peças soltas, problemas já existentes' });
  const fObj = el('textarea', { id: 'f-obj', rows: '2', maxlength: '600', placeholder: 'Objetos deixados no veículo' });
  const fValor = el('input', { id: 'f-valor', type: 'text', inputmode: 'decimal', placeholder: '0,00', autocomplete: 'off', value: ag0 && ag0.valor != null ? fmtQ(ag0.valor) : '' });
  const opcSel = []; // opcionais marcados na entrada
  const opcBox = el('div');
  const drawOpc = () => preencher(opcBox, chipsOpcionais(opcSel, (n, on) => { if (on) opcSel.push(n); else opcSel.splice(opcSel.indexOf(n), 1); drawOpc(); }));
  drawOpc();
  const fotosBox = el('div');
  const drawFotos = () => preencher(fotosBox, photoGrid({
    items: fotos, slots: ROTULOS,
    onAdd: async (rotulo, origem) => {
      const file = await pickPhoto(origem); if (!file) return;
      try {
        const blob = await compress(file);
        const i = ROTULOS.includes(rotulo) ? fotos.findIndex(f => f.rotulo === rotulo) : -1;
        const item = { rotulo, blob, url: URL.createObjectURL(blob) };
        if (i >= 0) { URL.revokeObjectURL(fotos[i].url); fotos[i] = item; } else fotos.push(item);
        drawFotos();
      } catch { toast('Não consegui abrir essa foto.', true); }
    },
    onRemove: f => { URL.revokeObjectURL(f.url); fotos.splice(fotos.indexOf(f), 1); drawFotos(); },
  }));
  drawFotos();

  // "Não usar": tira o aviso e segue a entrada sem ligar ao agendamento (o que já foi digitado fica).
  let ag = agAberto; // vira null se tocar em "Não usar"
  const avisoAg = ag ? avisoAgendamento(ag, () => { ag = null; S.entradaAg = null; avisoAg.remove(); toast('A entrada segue sem o agendamento.'); }) : null;

  const salvar = el('button', { class: 'btn btn--primary btn--lg btn--block', type: 'button' }, 'Iniciar serviço');
  salvar.addEventListener('click', async () => {
    if (!tiposOk.length) { toast('Cadastre um tipo de serviço com etapas em Ajustes.', true); return; }
    const tipo = tipoById(fTipo.value);
    if (!tipo) { toast('Escolha o tipo de serviço.', true); fTipo.focus(); fTipo.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    const clienteNome = fCliente.value.trim().replace(/\s+/g, ' '); // opcional: sem nome aparece "NOME PENDENTE"
    let valor = null;
    if (isCtrl() && fValor.value.trim()) { valor = parseNum(fValor.value); if (isNaN(valor)) { toast('Valor inválido.', true); return; } }
    salvar.disabled = true; salvar.textContent = 'Salvando…';
    const voltar = () => { salvar.disabled = false; salvar.textContent = 'Iniciar serviço'; };
    let fotosMeta;
    try {
      // Foto já enviada numa tentativa anterior (falhou ao salvar) não sobe de novo.
      const faltam = fotos.filter(f => !f.meta);
      if (faltam.length) salvar.textContent = `Enviando fotos 0 de ${faltam.length}…`;
      const enviadas = await enviarFotos(faltam.map(f => f.blob), n => { salvar.textContent = `Enviando fotos ${n} de ${faltam.length}…`; });
      enviadas.forEach((m, i) => { faltam[i].meta = m; });
      fotosMeta = fotos.map(f => ({ ...f.meta, rotulo: f.rotulo, em: Date.now() }));
    } catch (e) {
      voltar();
      toast(e && e.code === 'network' ? 'Sem internet. As fotos não foram enviadas, tente de novo.' : 'Não foi possível enviar as fotos. Tente de novo.', true); return;
    }
    salvar.textContent = 'Salvando…';
    const u = me();
    const at = {
      id: uid(), placa, tipoId: tipo.id, tipoNome: tipo.nome, etapas: [...tipo.etapas], etapaIndex: 0, feitas: {}, livres: livresDe(tipo), // etapas livres vêm do tipo (Ajustes)
      concluido: false, concluidoEm: null, criadoEm: Date.now(), criadoPorNome: u.nome, clienteNome, agendaId: ag ? ag.id : null,
      danos: fDanos.value.trim(), objetos: fObj.value.trim(), valor, fotos: fotosMeta, historico: [], opcionais: [...opcSel], opcionaisFeitos: {},
    };
    registrar(at, ag ? `Entrada do veículo (agendamento de ${brData(ag.data)})` : 'Entrada do veículo');
    if (opcSel.length) registrar(at, `Opcionais na entrada: ${opcSel.join(', ')}`);
    const ok = await commitAgora(() => {
      DB.veiculos[placa] = { ...(DB.veiculos[placa] || { criadoEm: Date.now() }), placa, descricao: fDesc.value.trim() };
      DB.atendimentos.push(at);
    });
    if (!ok) {
      voltar();
      const outro = ativoDaPlaca(placa); // outro aparelho abriu esta placa antes
      if (outro && outro !== at) { go(`#/veiculo/${esc(outro.id)}`); return; }
      // Não foi salvo (sem internet): tira da lista e fica no formulário para tentar de novo.
      DB.atendimentos = DB.atendimentos.filter(x => x !== at);
      return;
    }
    for (const f of fotos) URL.revokeObjectURL(f.url);
    // Agendamento usado: fica "em serviço" na agenda (operação própria, liberada também para o Funcionário).
    // Quando o serviço for concluído, o servidor muda o agendamento para "concluído".
    if (ag) {
      const item = agendaAtiva().find(x => x.id === ag.id);
      if (item) item.status = 'em_servico';
      S.entradaAg = null;
      enviar([{ col: 'agenda', acao: 'entrada', id: ag.id }], { redesenhar: false });
    }
    toast('Serviço iniciado.');
    go(`#/veiculo/${esc(at.id)}`);
  });

  const body = el('div', { class: 'stack', style: 'max-width:640px' },
    backLink('#/placa', 'Ler outra placa'),
    avisoAg,
    el('div', { class: 'veh-head' },
      el('span', { class: 'veh-plate', text: fmtPlaca(placa) }),
      el('span', { class: 'veh-sub', text: anteriores.n ? `Veículo já atendido ${anteriores.n} ${anteriores.n === 1 ? 'vez' : 'vezes'}. Último serviço em ${fmtData(anteriores.ultimoEm)}.` : 'Novo veículo. Registre a entrada.' })),
    el('div', { class: 'card' },
      el('h2', { text: 'Serviço' }),
      el('div', { class: 'field' }, el('label', { for: 'f-cliente', text: 'Nome do cliente (opcional)' }), fCliente),
      el('div', { class: 'field' }, el('label', { for: 'f-tipo', text: 'Tipo de serviço' }),
        tiposOk.length ? fTipo : el('p', { class: 'hint', text: 'Nenhum tipo de serviço com etapas. O Controle cadastra em Ajustes.' })),
      el('div', { class: 'field' }, el('label', { for: 'f-desc', text: 'Veículo (marca e modelo primeiro)' }), fDesc),
      (DB.opcionais || []).length ? el('div', { class: 'field' }, el('span', { class: 'label', text: 'Opcionais (ex.: carpete que vai no veículo)' }), opcBox) : null,
      isCtrl() ? el('div', { class: 'field' }, el('label', { for: 'f-valor', text: 'Valor do serviço (R$)' }), fValor) : null),
    el('div', { class: 'card' },
      el('h2', { text: 'Fotos de entrada' }),
      fotosBox),
    el('div', { class: 'card' },
      el('h2', { text: 'Estado na entrada' }),
      el('div', { class: 'field' }, el('label', { for: 'f-danos', text: 'Danos ou problemas' }), fDanos),
      el('div', { class: 'field' }, el('label', { for: 'f-obj', text: 'Objetos pessoais no veículo' }), fObj)),
    salvar);
  shell(body, { current: 'placa' });
}

/* =====================================================================
   Tela: veículo em serviço (etapas, fotos, histórico)
   ===================================================================== */
// Etapas com a data e a foto tirada ao concluir cada uma. fmt: formato da data; src(f): endereço da miniatura.
// acoes(foto, i): botões ao abrir a foto da etapa. semFoto(i): toque no espaço vazio de etapa concluída sem foto.
// Concluir etapa: depois da primeira foto, janela com as fotos tiradas para juntar mais (câmera ou galeria,
// várias de uma vez) ou tirar alguma. Devolve a lista de fotos ou null (cancelou).
// semFotoOk: etapa com foto opcional (Ajustes): a janela abre sem foto e deixa concluir sem nenhuma.
function fotosDaEtapa(nome, primeira, { semFotoOk = false } = {}) {
  return new Promise(resolve => {
    const lista = primeira ? [{ blob: primeira, url: URL.createObjectURL(primeira) }] : [];
    const d = el('dialog', { class: 'sheet', 'aria-label': `Fotos: ${nome}` });
    let fim = false;
    const fechar = r => { if (fim) return; fim = true; lista.forEach(x => URL.revokeObjectURL(x.url)); if (d.open) d.close(); d.remove(); resolve(r); };
    const add = b => { if (b) lista.push({ blob: b, url: URL.createObjectURL(b) }); };
    const grade = el('div', { class: 'etapa-fotos' });
    const ok = el('button', { class: 'btn btn--primary btn--lg btn--block', type: 'button', onclick: () => fechar(lista.map(x => x.blob)) });
    const inp = el('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true });
    inp.addEventListener('change', () => { [...(inp.files || [])].forEach(add); inp.value = ''; desenhar(); });
    const desenhar = () => {
      preencher(grade, ...lista.map((x, k) => el('div', { class: 'etapa-foto' }, el('img', { src: x.url, alt: `Foto ${k + 1}` }),
        el('button', { class: 'etapa-foto-x', type: 'button', 'aria-label': `Tirar a foto ${k + 1}`, onclick: () => { URL.revokeObjectURL(x.url); lista.splice(k, 1); desenhar(); } }, '×'))));
      ok.disabled = !lista.length && !semFotoOk;
      ok.textContent = lista.length > 1 ? `Concluir etapa (${lista.length} fotos)` : lista.length ? 'Concluir etapa' : semFotoOk ? 'Concluir sem foto' : 'Tire uma foto para concluir';
      maisUma.lastChild.textContent = lista.length ? 'Mais uma foto' : 'Tirar foto';
      aviso.hidden = !semFotoOk || lista.length > 0;
    };
    d.addEventListener('cancel', e => { e.preventDefault(); fechar(null); });
    const maisUma = el('button', { class: 'btn btn--lg grow', type: 'button', onclick: async () => { add(await pickPhoto()); desenhar(); } }, icon('camera'), el('span', { text: 'Mais uma foto' }));
    const aviso = el('p', { class: 'hint', text: 'Nesta etapa a foto é opcional. Se puder, tire uma: ela aparece para o cliente no andamento.' });
    preencher(d, el('div', { class: 'sheet-in' },
      el('div', { class: 'card-head' }, el('h2', { text: nome }), el('button', { class: 'link-btn', type: 'button', onclick: () => fechar(null) }, 'Cancelar')),
      aviso, grade,
      el('div', { class: 'actions' },
        maisUma,
        el('button', { class: 'btn btn--lg grow', type: 'button', onclick: () => inp.click() }, icon('image'), 'Galeria')),
      ok, inp));
    desenhar();
    document.body.append(d);
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  });
}
// Etapas com as fotos de cada uma (pode ter várias). Equipe: miniaturas embaixo do nome (tocar abre a foto
// com acoes) e, na etapa feita, um espaço com câmera para mais uma foto. Cliente (fotoGrande): fotos grandes,
// lado a lado com rolagem quando são várias.
function listaEtapas(at, { fmt, src, atual = 'Agora', acoes, semFoto, concluir, concluirOpc, fotoGrande }) {
  // Opcionais: depois das etapas, menores e roxos. Concluir com foto a qualquer hora (concluirOpc).
  const opcs = opcionaisDe(at).map(nome => {
    const feito = at.concluido || opcFeitos(at)[nome] != null;
    const fotos = at.fotos.filter(f => f.opcional === nome), alvo = { opc: nome };
    const quando = opcFeitos(at)[nome] ? fmt(opcFeitos(at)[nome]) : '';
    const maisFoto = feito && semFoto ? el('button', { class: 'step-foto is-vazia', type: 'button', 'aria-label': `Adicionar foto: ${nome}`, onclick: () => semFoto(alvo) }, icon('camera')) : null;
    const galeria = !fotos.length ? null : fotoGrande
      ? el('div', { class: 'step-fotos-grandes' + (fotos.length > 1 ? ' is-varias' : '') }, fotos.map((foto, k) =>
        el('button', { class: 'step-foto-grande', type: 'button', 'aria-label': `Ver foto ${k + 1}: ${nome}`, onclick: () => openViewer(foto) },
          el('img', { src: foto.url, srcset: foto.mini ? `${foto.mini} 480w, ${foto.url} 1600w` : null, sizes: '(max-width: 560px) 70vw, 300px', alt: `Foto: ${nome}`, loading: 'lazy' }))))
      : el('div', { class: 'step-fotos' }, fotos.map((foto, k) =>
        el('button', { class: 'step-foto', type: 'button', 'aria-label': `Ver foto ${k + 1}: ${nome}`, onclick: () => openViewer(foto, acoes ? acoes(foto, alvo) : []) },
          el('img', { src: src(foto), alt: '', loading: 'lazy' }))), maisFoto);
    let lado = el('span');
    if (!feito && concluirOpc) { const b = el('button', { class: 'step-concluir', type: 'button', 'aria-label': `Concluir: ${nome}` }, icon('camera'), 'Concluir'); b.addEventListener('click', () => concluirOpc(nome, b)); lado = b; }
    else if (!fotos.length && maisFoto) lado = maisFoto;
    return el('li', { class: 'step step--opc ' + (feito ? 'is-done' : 'is-current') },
      el('span', { class: 'step-dot' }, feito ? icon('check') : null),
      el('span', { class: 'step-main' }, el('span', { class: 'step-name' }, el('span', { class: 'step-opc-tag', text: 'Opcional' }), nome),
        quando ? el('span', { class: 'step-when', text: quando }) : null, galeria),
      lado);
  });
  return el('ol', { class: 'steps' }, ...at.etapas.map((nome, i) => {
    const cur = etapaLiberada(at, i), done = !cur && etapaFeita(at, i);
    const fotos = at.fotos.filter(f => f.etapa === i);
    const quando = at.feitas[i] ? fmt(at.feitas[i]) : cur ? atual : '';
    const maisFoto = done && semFoto ? el('button', { class: 'step-foto is-vazia', type: 'button', 'aria-label': `Adicionar foto: ${nome}`, onclick: () => semFoto(i) }, icon('camera')) : null;
    let galeria = null;
    if (fotos.length && fotoGrande) {
      galeria = el('div', { class: 'step-fotos-grandes' + (fotos.length > 1 ? ' is-varias' : '') }, fotos.map((foto, k) =>
        el('button', { class: 'step-foto-grande', type: 'button', 'aria-label': `Ver foto ${k + 1}: ${nome}`, onclick: () => openViewer(foto) },
          el('img', { src: foto.url, srcset: foto.mini ? `${foto.mini} 480w, ${foto.url} 1600w` : null, sizes: '(max-width: 560px) 70vw, 300px', alt: `Foto: ${nome}`, loading: 'lazy' }))));
    } else if (fotos.length) {
      galeria = el('div', { class: 'step-fotos' }, fotos.map((foto, k) =>
        el('button', { class: 'step-foto', type: 'button', 'aria-label': `Ver foto ${k + 1}: ${nome}`, onclick: () => openViewer(foto, acoes ? acoes(foto, i) : []) },
          el('img', { src: src(foto), alt: '', loading: 'lazy' }))), maisFoto);
    }
    let lado = el('span');
    if (cur && concluir) { lado = el('button', { class: 'step-concluir', type: 'button', 'aria-label': `Concluir: ${nome}` }, icon(fotoObrigatoria(at, i) ? 'camera' : 'check'), 'Concluir'); const b = lado; b.addEventListener('click', () => concluir(i, b)); }
    else if (!fotos.length && maisFoto) lado = maisFoto;
    return el('li', { class: 'step ' + (done ? 'is-done' : cur ? 'is-current' : 'is-todo') },
      el('span', { class: 'step-dot' }, done ? icon('check') : null),
      el('span', { class: 'step-main' }, el('span', { class: 'step-name', text: nome }), quando ? el('span', { class: 'step-when', text: quando }) : null, galeria),
      lado);
  }), ...opcs);
}

/* Opções do Controle > Tipo de serviço: troca o tipo de um veículo em andamento sem perder o que já foi feito.
   Antes de confirmar mostra o que continua feito, o que entra e o que sai (aplicarTipo numa cópia). */
function campoTrocarTipo(at, redraw) {
  if (at.concluido || DB.tipos.length < 2) return null;
  const sel = el('select', { 'aria-label': 'Tipo de serviço' },
    DB.tipos.some(t => t.id === at.tipoId) ? null : el('option', { value: '', selected: true }, at.tipoNome || 'Sem tipo'),
    DB.tipos.map(t => el('option', { value: t.id, selected: t.id === at.tipoId }, t.nome)));
  const previa = el('div', { class: 'troca-tipo', hidden: true });
  const btn = el('button', { class: 'btn', type: 'button', style: 'flex:none', disabled: true }, 'Trocar');
  const escolhido = () => DB.tipos.find(t => t.id === sel.value && t.id !== at.tipoId && t.etapas.length);
  const desenhar = () => {
    const t = escolhido(); btn.disabled = !t; previa.hidden = !t;
    if (!t) return;
    const copia = JSON.parse(JSON.stringify(at)); aplicarTipo(copia, t);
    const tem = (lista, n) => lista.some(x => nomeEtapa(x) === nomeEtapa(n));
    const ficam = copia.etapas.filter((_, j) => etapaFeita(copia, j));
    const entram = copia.etapas.filter((n, j) => !etapaFeita(copia, j));
    const saem = at.etapas.filter((n, i) => !etapaFeita(at, i) && !tem(copia.etapas, n));
    const grupo = (tit, nomes, cls) => nomes.length ? el('div', { class: 'troca-grupo' }, el('span', { class: 'label', text: tit }),
      el('div', { class: 'troca-tags' }, nomes.map(n => el('span', { class: 'tag ' + cls, text: n })))) : null;
    preencher(previa,
      grupo('Continuam feitas', ficam, 'tag--ok'),

/* Movimentações do estoque: linha do tempo por dia, no mesmo jeito do histórico do veículo.
   Cada linha: tipo (Entrada verde, Retirada laranja, Contagem tracejada), material, observação, hora e quem,
   e à direita a quantidade e o saldo que ficou depois (soma dos movimentos até ali, de todos).
   Controle filtra por tipo e por material; Funcionário vê só as próprias retiradas. */
const MOV_TIPOS = { entrada: { rot: 'Entrada', txt: '+' }, saida: { rot: 'Retirada', txt: '−' }, ajuste: { rot: 'Contagem', ico: 'check' } };
const MOV_FILTROS = [['todos', 'Todos'], ['entrada', 'Entradas'], ['saida', 'Retiradas'], ['ajuste', 'Contagens']];
function historicoEstoque(ctrl, u) {
  const chave = 'movimentos', itens = DB.estoque.itens;
  const ordem = DB.estoque.movimentos.slice().sort((a, b) => (a.em || 0) - (b.em || 0));
  const ficou = new Map(), acum = {};
  for (const m of ordem) { acum[m.itemId] = round2((acum[m.itemId] || 0) + m.delta); ficou.set(m, acum[m.itemId]); }
  const meus = ordem.filter(m => ctrl || m.porId === (u && u.id)).reverse();
  const box = el('div', { class: 'hv' });
  const hora = ts => new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' }).format(ts);
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const rotDia = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); const dif = Math.round((hoje - d) / 864e5);
    return dif === 0 ? 'Hoje' : dif === 1 ? 'Ontem' : `${DIAS_SEMANA[d.getDay()]}, ${fmtData(ts)}`; };
  const draw = () => {
    const f = S.estFiltro || {};
    const tipo = ctrl && MOV_FILTROS.some(x => x[0] === f.tipo) ? f.tipo : 'todos';
    const doItem = ctrl && f.item && meus.some(m => m.itemId === f.item) ? f.item : '';
    const base = doItem ? meus.filter(m => m.itemId === doItem) : meus;
    const lista = tipo === 'todos' ? base : base.filter(m => m.tipo === tipo);
    const n = Math.min(lista.length, S.abertos[chave] || 8);
    const dias = [];
    for (const m of lista.slice(0, n)) { const r = rotDia(m.em); if (!dias.length || dias[dias.length - 1].r !== r) dias.push({ r, itens: [] }); dias[dias.length - 1].itens.push(m); }
    const item = m => {
      const t = MOV_TIPOS[m.tipo] || MOV_TIPOS.ajuste, it = itens.find(x => x.id === m.itemId), un = it ? it.unidade : '';
      const obs = m.obs && !(m.tipo === 'ajuste' && m.obs === 'Contagem') ? m.obs : '';
      return el('li', { class: `hv-item hv-mov is-${m.tipo}` },
        el('span', { class: 'hv-ico', 'aria-hidden': 'true' }, t.ico ? icon(t.ico) : t.txt),
        el('div', { class: 'hv-main' },
          el('span', { class: 'hv-tag', text: t.rot }),
          el('span', { class: 'hv-txt', text: it ? it.nome : '(material removido)' }),
          obs ? el('span', { class: 'hv-obs', text: obs }) : null,
          el('span', { class: 'hv-meta', text: [hora(m.em), ctrl ? (m.porId === (u && u.id) ? 'Você' : m.porNome) : ''].filter(Boolean).join(' · ') })),
        el('div', { class: 'mov-qtd' },
          el('b', { text: `${m.delta > 0 ? '+' : '−'}${fmtQ(Math.abs(m.delta))} ${un}`.trim() }),
          el('small', { text: `ficou ${fmtQ(ficou.get(m))}` })));
    };
    const falta = lista.length - n;
    const comMov = itens.filter(it => meus.some(m => m.itemId === it.id));
    preencher(box,
      el('div', { class: 'card-head' }, el('h2', { text: ctrl ? 'Movimentações' : 'Suas retiradas' }), meus.length ? el('span', { class: 'count', text: String(meus.length) }) : null),
      ctrl && comMov.length > 1 ? el('select', { 'aria-label': 'Material', onchange: e => { S.estFiltro = { ...f, item: e.target.value }; delete S.abertos[chave]; draw(); } },
        el('option', { value: '', selected: !doItem }, 'Todos os materiais'),
        comMov.map(it => el('option', { value: it.id, selected: it.id === doItem }, it.nome))) : null,
      ctrl && meus.length > 3 ? el('div', { class: 'hv-filtros quebra', role: 'group', 'aria-label': 'Filtrar movimentações' }, MOV_FILTROS.map(([k, rot]) => {
        const qtd = k === 'todos' ? base.length : base.filter(m => m.tipo === k).length;
        return k !== 'todos' && !qtd && k !== tipo ? null : el('button', { type: 'button', 'aria-pressed': String(k === tipo), onclick: () => { S.estFiltro = { ...f, tipo: k }; delete S.abertos[chave]; draw(); } },
          rot, el('span', { class: 'hv-qtd', text: String(qtd) }));
      })) : null,
      lista.length ? dias.map(d => el('section', { class: 'hv-dia' }, el('h3', { text: d.r }), el('ol', {}, d.itens.map(item))))
        : el('p', { class: 'hint', text: !meus.length ? (ctrl ? 'Nenhuma movimentação ainda.' : 'Você ainda não registrou retiradas.') : 'Nenhuma movimentação com esse filtro.' }),
      falta > 0 || n > 8 ? el('div', { class: 'actions', style: 'gap:14px' },
        falta > 0 ? el('button', { class: 'link-btn', type: 'button', onclick: () => { S.abertos[chave] = n + 20; draw(); } }, `Mostrar mais (${falta})`) : null,
        n > 8 ? el('button', { class: 'link-btn', type: 'button', onclick: () => { delete S.abertos[chave]; draw(); } }, 'Mostrar menos') : null) : null);
  };
  draw();
  return el('div', { class: 'card', id: 'movimentacoes' }, box);
}

/* =====================================================================

  const rotDia = ts => { if (!ts) return 'Sem data'; const d = new Date(ts); d.setHours(0, 0, 0, 0); const dif = Math.round((hoje - d) / 864e5);
    return dif === 0 ? 'Hoje' : dif === 1 ? 'Ontem' : `${DIAS_SEMANA[d.getDay()]}, ${fmtData(ts)}`; };

// Abas de Ajustes: Geral (#/ajustes) e Notificações (#/ajustes/notificacoes).

    const emUso = DB.atendimentos.filter(a => a.tipoId === t.id && !a.concluido).length;
    const fora = foraDoTipo(t).length;
    // Toda mudança nas etapas vale também para os veículos em andamento deste tipo (o que já foi feito continua).
    const mudarEtapas = fn => {
      commit(() => { t.livres = livresDe(t); t.semFoto = semFotoDe(t); fn(); sincronizarEtapas(t); });
      if (emUso && t.etapas.length) toast(emUso === 1 ? 'Salvo, também no veículo em serviço.' : `Salvo, também nos ${emUso} veículos em serviço.`);

    };
    add.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addEtapa(); } });
    const move = (i, d) => mudarEtapas(() => { for (const l of [t.etapas, t.livres, t.semFoto]) { const [x] = l.splice(i, 1); l.splice(i + d, 0, x); } });
    const lv = livresDe(t), sf = semFotoDe(t);

    const linhaEtapa = (nome, i) => {

        el('button', { class: 'icon-btn', type: 'button', 'aria-label': `Descer ${nome}`, disabled: i === t.etapas.length - 1, onclick: () => move(i, 1) }, icon('down')),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': `Editar ${nome}`, onclick: () => { S.etapaEdit = `${t.id}:${i}`; redraw(); } }, icon('edit')));

/* =====================================================================
   Datas (agenda e relatórios). Dias no formato AAAA-MM-DD, no fuso do aparelho.
   ===================================================================== */
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const DIAS_SEMANA = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
const pad2 = n => String(n).padStart(2, '0');
const isoDia = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
const isoDe = dt => isoDia(dt.getFullYear(), dt.getMonth(), dt.getDate());
const hojeISO = () => isoDe(new Date());
const dataDe = k => { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, m - 1, d); };
const somaDias = (k, n) => { const d = dataDe(k); d.setDate(d.getDate() + n); return isoDe(d); };
const brDia = k => (k ? `${k.slice(8, 10)}/${k.slice(5, 7)}` : '');
const brData = k => (k ? `${k.slice(8, 10)}/${k.slice(5, 7)}/${k.slice(0, 4)}` : '');

// Feriados: nacionais, Rondônia e Jaru (os mesmos da agenda antiga).
const cacheFeriados = {};
function feriados(y) {
  if (cacheFeriados[y]) return cacheFeriados[y];
  const f = {};
  const add = (k, nome) => { f[k] = f[k] ? `${f[k]} · ${nome}` : nome; };
  [[0, 1, 'Confraternização Universal'], [3, 21, 'Tiradentes'], [4, 1, 'Dia do Trabalho'], [8, 7, 'Independência do Brasil'],
    [9, 12, 'Nossa Senhora Aparecida'], [10, 2, 'Finados'], [10, 15, 'Proclamação da República'], [10, 20, 'Consciência Negra'],
    [11, 25, 'Natal'], [0, 4, 'Instalação do Estado de Rondônia'], [5, 16, 'Criação do município de Jaru'],
    [5, 24, 'São João Batista, padroeiro de Jaru'], [11, 24, 'Véspera de Natal'], [11, 31, 'Véspera de Ano-Novo']]
    .forEach(([m, d, n]) => add(isoDia(y, m, d), n));
  // Páscoa (algoritmo de Meeus) e as datas móveis
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, g = Math.floor((b - Math.floor((b + 8) / 25) + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, mm = Math.floor((a + 11 * h + 22 * l) / 451);
  const pascoa = isoDia(y, Math.floor((h + l - 7 * mm + 114) / 31) - 1, ((h + l - 7 * mm + 114) % 31) + 1);
  add(somaDias(pascoa, -48), 'Carnaval'); add(somaDias(pascoa, -47), 'Carnaval'); add(somaDias(pascoa, -46), 'Quarta-feira de Cinzas');
  add(somaDias(pascoa, -2), 'Sexta-feira Santa'); add(somaDias(pascoa, 60), 'Corpus Christi');
  return (cacheFeriados[y] = f);
}

/* =====================================================================
   Tela: relatórios (Controle). Faturamento e estoque por período; PDF para baixar.
   Faturamento = serviços concluídos no período (pela data de conclusão) que têm valor.
   ===================================================================== */
function periodoRel() {
  if (!S.rel) S.rel = { preset: 'mes' };
  const R = S.rel, t = new Date();
  if (R.preset === 'mes') { R.de = isoDia(t.getFullYear(), t.getMonth(), 1); R.ate = isoDia(t.getFullYear(), t.getMonth() + 1, 0); }
  else if (R.preset === 'anterior') { R.de = isoDia(t.getFullYear(), t.getMonth() - 1, 1); R.ate = isoDia(t.getFullYear(), t.getMonth(), 0); }
  else if (R.preset === 'ano') { R.de = isoDia(t.getFullYear(), 0, 1); R.ate = isoDia(t.getFullYear(), 11, 31); }
  else { R.de = R.de || isoDia(t.getFullYear(), t.getMonth(), 1); R.ate = R.ate || hojeISO(); }
  // isoDia com dia 0 volta para o último dia do mês anterior; normaliza pelo Date
  R.de = isoDe(dataDe(R.de)); R.ate = isoDe(dataDe(R.ate));
  if (R.ate < R.de) [R.de, R.ate] = [R.ate, R.de];
  return R;
}
function calcularRelatorio(de, ate) {
  const ini = dataDe(de).getTime(), fim = dataDe(somaDias(ate, 1)).getTime();
  const dentro = ms => ms != null && ms >= ini && ms < fim;
  const concluidos = DB.atendimentos.filter(a => a.concluido && dentro(a.concluidoEm)).sort((a, b) => a.concluidoEm - b.concluidoEm);
  const comValor = concluidos.filter(a => a.valor != null);
  const faturamento = round2(comValor.reduce((s, a) => s + a.valor, 0));
  const porTipo = new Map();
  for (const a of comValor) { const t = porTipo.get(a.tipoNome || 'Sem tipo') || { qtd: 0, total: 0 }; t.qtd++; t.total = round2(t.total + a.valor); porTipo.set(a.tipoNome || 'Sem tipo', t); }
  const andamento = DB.atendimentos.filter(a => !a.concluido);
  const previsto = round2(andamento.reduce((s, a) => s + (a.valor || 0), 0));
  const movs = DB.estoque.movimentos.filter(m => dentro(m.em));
  const itens = DB.estoque.itens.map(it => {
    const ms = movs.filter(m => m.itemId === it.id);
    const soma = tipo => round2(ms.filter(m => m.tipo === tipo).reduce((s, m) => s + m.delta, 0));
    return { nome: it.nome, unidade: it.unidade, entrou: soma('entrada'), saiu: -soma('saida'), ajuste: soma('ajuste'), saldo: saldo(it.id) };
  });
  const porPessoa = new Map();
  for (const m of movs.filter(m => m.tipo === 'saida')) {
    const it = DB.estoque.itens.find(x => x.id === m.itemId); if (!it) continue;
    const k = `${m.porNome || 'Sem nome'}|${it.id}`;
    const r = porPessoa.get(k) || { pessoa: m.porNome || 'Sem nome', material: it.nome, unidade: it.unidade, qtd: 0 };
    r.qtd = round2(r.qtd - m.delta); porPessoa.set(k, r);
  }
  return {
    de, ate, concluidos, comValor, faturamento, semValor: concluidos.length - comValor.length,
    ticket: comValor.length ? round2(faturamento / comValor.length) : 0,
    porTipo: [...porTipo].map(([tipo, t]) => ({ tipo, ...t })).sort((a, b) => b.total - a.total),
    andamento: andamento.length, previsto, itens,
    retiradas: [...porPessoa.values()].sort((a, b) => a.pessoa.localeCompare(b.pessoa) || a.material.localeCompare(b.material)),
  };
}

   Funcionários, tipos e materiais são ligados pelo nome aos que já existem no banco.

    status, el('div', {}, btn));
}

    const x = porNome(DB.funcionarios, f.nome) || porNome(novosFunc, f.nome);
    if (x) mapFunc.set(f.id, x.id); else { const n = { id: uid(), nome: f.nome, nivel: f.nivel === 'controle' ? 'controle' : 'funcionario' }; novosFunc.push(n); mapFunc.set(f.id, n.id); }
  }
  for (const t of d.tipos || []) {
    const x = porNome(DB.tipos, t.nome) || porNome(novosTipos, t.nome);
    if (x) mapTipo.set(t.id, x.id); else { const n = { id: uid(), nome: t.nome, etapas: [...(t.etapas || [])] }; novosTipos.push(n); mapTipo.set(t.id, n.id); }
  }
  for (const it of (d.estoque || {}).itens || []) {
    const x = porNome(DB.estoque.itens, it.nome) || porNome(novosItens, it.nome);
    if (x) mapItem.set(it.id, x.id); else { const n = { id: uid(), nome: it.nome, unidade: it.unidade || 'un', minimo: Number(it.minimo) || 0 }; novosItens.push(n); mapItem.set(it.id, n.id); }
  }
  const pessoa = id => (id && mapFunc.get(id)) || id || null;

  // Atendimentos: pula os já enviados e os de placa que já tem serviço em andamento no banco.
  const jaTem = new Set(DB.atendimentos.map(a => a.id));
  const emAndamento = new Set(DB.atendimentos.filter(a => !a.concluido).map(a => a.placa));
  const ats = [];
  let pulados = 0, nFotos = 0;
  const lista = (d.atendimentos || []).filter(a => !jaTem.has(a.id) && isValid(a.placa) && (a.etapas || []).length);
  for (const [i, a] of lista.entries()) {
    if (!a.concluido && emAndamento.has(a.placa)) { pulados++; continue; }
    if (!a.concluido) emAndamento.add(a.placa);
    progresso(`Enviando atendimento ${i + 1} de ${lista.length} (${fmtPlaca(a.placa)})…`);
    const fotos = [];
    for (const f of a.fotos || []) {
      let blob = null; try { blob = await fotoAntiga(f.id); } catch {}
      if (!blob) continue;
      fotos.push({ ...(await enviarFoto(blob)), rotulo: f.rotulo, em: f.em || a.criadoEm });
      nFotos++;
    }
    ats.push({
      id: a.id, placa: a.placa, tipoId: mapTipo.get(a.tipoId) || null, tipoNome: a.tipoNome || '', etapas: [...a.etapas],
      etapaIndex: Math.min(Math.max(0, a.etapaIndex | 0), a.etapas.length - 1), feitas: a.feitas || {}, concluido: !!a.concluido,
      concluidoEm: a.concluidoEm || null, criadoEm: a.criadoEm || Date.now(), criadoPorNome: a.criadoPorNome || '',
      danos: a.danos || '', objetos: a.objetos || '', valor: a.valor == null ? null : Number(a.valor), fotos,
      historico: (a.historico || []).map(h => ({ ...h, porId: pessoa(h.porId) })),
    });
  }
  const jaMov = new Set(DB.estoque.movimentos.map(m => m.id));
  const movs = ((d.estoque || {}).movimentos || []).filter(m => !jaMov.has(m.id) && mapItem.has(m.itemId))
    .map(m => ({ ...m, itemId: mapItem.get(m.itemId), porId: pessoa(m.porId) }));

  progresso('Salvando no banco…');
  const ok = await commitAgora(() => {
    DB.funcionarios.push(...novosFunc);
    DB.tipos.push(...novosTipos);
    DB.estoque.itens.push(...novosItens);
    for (const [placa, v] of Object.entries(d.veiculos || {})) {
      if (!isValid(placa)) continue;
      const atual = DB.veiculos[placa];
      if (!atual) DB.veiculos[placa] = { placa, descricao: v.descricao || '', criadoEm: v.criadoEm || Date.now() };
      else if (!atual.descricao && v.descricao) atual.descricao = v.descricao;
    }
    for (const a of ats) if (!DB.veiculos[a.placa]) DB.veiculos[a.placa] = { placa: a.placa, descricao: '', criadoEm: a.criadoEm };
    DB.atendimentos.push(...ats);
    DB.estoque.movimentos.push(...movs);
  });
  if (!ok) throw new Error('importar');
  return { atendimentos: ats.length, fotos: nFotos, movimentos: movs.length, pulados };
}

/* =====================================================================
   Tela: cliente (só placa, andamento e fotos)
   ===================================================================== */
function renderClient(placaRaw) {
  const placa = norm(placaRaw || '');
  const input = el('input', { class: 'plate-input', type: 'text', maxlength: '8', placeholder: 'ABC1D23', value: placa, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', enterkeyhint: 'go', 'aria-label': 'Placa do veículo' });
  const buscar = () => {
    const p = norm(input.value);
    if (!isValid(p)) { toast('Placa inválida. São 7 caracteres, como ABC1D23.', true); input.focus(); return; }
    go(`#/${esc(p)}`);
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); buscar(); } });

  const result = el('div', { class: 'stack' });
  const body = el('div', { class: 'client stack-lg' },
    el('div', { class: 'client-hero' }, el('h1', { text: 'Acompanhe seu veículo' }), el('p', { text: 'Digite a placa para ver o andamento do serviço e as fotos.' })),
    el('div', { class: 'row' }, input, el('button', { class: 'btn btn--primary', type: 'button', style: 'flex:none', onclick: buscar }, 'Ver andamento')),
    result);
  shell(body, { nav: false });
  if (placa) carregarCliente(placa, result);
}
async function carregarCliente(placa, box) {
  preencher(box, el('p', { class: 'hint', text: 'Buscando…' }));

  catch (e) {
    if (norm(parts()[0] || '') !== placa) return;
    preencher(box, el('p', { class: 'empty', text: e && e.code === 'network' ? 'Sem internet. Confira a conexão e tente de novo.' : 'Não deu para buscar agora. Tente de novo em instantes.' }));
    return;
  }
  if (norm(parts()[0] || '') !== placa) return; // já saiu desta tela
  if (!at) {
    preencher(box, el('p', { class: 'empty', text: `Não encontramos serviço para a placa ${fmtPlaca(placa)}. Confira a placa ou fale com a Strike Details.` }));
    return;
  }
  const desenhar = () => {
  const pct = Math.round(progresso(at) * 100);
  // Duas abas: Andamento (etapas e fotos da entrada) e Observações (danos, objetos pessoais e fotos de Danos da entrada).
  const fotosDanos = at.fotos.filter(f => !eFotoDeServico(f) && f.rotulo === 'Danos');
  const nAvarias = fotosDanos.length + (at.danos ? 1 : 0) + (at.objetos ? 1 : 0);
  const aba = S.clienteAba === 'avarias' ? 'avarias' : 'andamento';
  const trocar = a => { S.clienteAba = a; desenhar(); };
  const conteudo = aba === 'avarias'
    ? [nAvarias ? null : el('p', { class: 'empty', text: 'Nenhuma observação registrada.' }),
      at.danos || at.objetos ? el('div', { class: 'card' }, el('dl', { class: 'kv' },
          at.danos ? el('div', {}, el('dt', { text: 'Danos ou problemas' }), el('dd', { style: 'white-space:pre-wrap', text: at.danos })) : null,
          at.objetos ? el('div', {}, el('dt', { text: 'Objetos pessoais' }), el('dd', { style: 'white-space:pre-wrap', text: at.objetos })) : null)) : null,
      fotosDanos.length ? el('div', { class: 'card' }, el('h2', { text: 'Fotos' }), photoGrid({ items: fotosDanos })) : null]
    : [el('div', { class: 'card' }, el('h2', { text: 'Andamento' }),
        listaEtapas(at, { fmt: fmtData, src: f => f.mini || f.url, atual: 'Em andamento', fotoGrande: true })),
      (() => { const entrada = at.fotos.filter(f => !eFotoDeServico(f) && f.rotulo !== 'Danos');
        return entrada.length ? el('div', { class: 'card' }, el('h2', { text: 'Fotos da entrada' }), photoGrid({ items: entrada })) : null; })()];
  preencher(box, 
    el('div', { class: 'veh-head' },
      el('span', { class: 'veh-plate', text: fmtPlaca(at.placa) }),
      el('span', { class: 'veh-sub', text: [at.descricao, at.tipoNome].filter(Boolean).join(' · ') })),
    el('div', { class: 'status-big' },
      el('span', { class: 'k', text: at.concluido ? 'SERVIÇO CONCLUÍDO' : 'ETAPA ATUAL' }),
      el('span', { class: 'v', text: at.concluido ? 'Pronto' : etapaAtual(at) }),
      el('div', { class: 'bar' }, el('i', { style: `width:${pct}%` }))),
    el('div', { class: 'seg', role: 'tablist', 'aria-label': 'Informações do veículo', style: 'display:flex;width:100%' },
      el('button', { type: 'button', role: 'tab', style: 'flex:1;padding:11px 12px;font-size:14px', 'aria-pressed': String(aba === 'andamento'), 'aria-selected': String(aba === 'andamento'), onclick: () => trocar('andamento') }, 'Andamento'),
      el('button', { type: 'button', role: 'tab', style: 'flex:1;padding:11px 12px;font-size:14px', 'aria-pressed': String(aba === 'avarias'), 'aria-selected': String(aba === 'avarias'), onclick: () => trocar('avarias') }, nAvarias ? `Observações (${nAvarias})` : 'Observações')),
    ...conteudo);
  };
  desenhar();
}

/* ---------- Início ---------- */
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); });
// Aberto em "/" (ex.: recarregado pelo service worker): vai para o Início, com a aba marcada no menu.
if (!MODO_CLIENTE && !location.hash && getSession()) history.replaceState(null, '', '#/inicio');
route();

// Só para testes automatizados; não afeta o uso normal.
window.__sd = { norm, isValid, fixByPosition, extractPlates, saldo, get DB() { return DB; } };
})();
