  const fotosBox = el('div');
  fotosBox.append(photoGrid({
    items: at.fotos.filter(f => !eFotoDeEtapa(f)),
    onAdd: at.concluido && !ctrl ? null : async rotulo => {
      const file = await pickPhoto(); if (!file) return;
      try {
        const blob = await compress(file);
        toast('Enviando foto…');
        S.ocupado = true;
        let m;
        try { m = await enviarFoto(blob); } finally { S.ocupado = false; }
        const atual = DB.atendimentos.find(a => a.id === at.id);
        if (!atual) { toast('Este atendimento não está mais na lista.', true); return; }
        commit(() => { atual.fotos.push({ ...m, rotulo, em: Date.now() }); registrar(atual, `Foto adicionada: ${rotulo}`); });
        toast('Foto salva.');
        if (parts()[1] === id) redraw();
      } catch (e) { toast(e && e.code === 'network' ? 'Sem internet. A foto não foi enviada.' : 'Não foi possível enviar a foto.', true); }
    },
    onRemove: ctrl ? f => {
      if (!window.confirm(`Remover a foto "${f.rotulo}"?`)) return;
      if (commit(() => { at.fotos = at.fotos.filter(x => x.id !== f.id); registrar(at, `Foto removida: ${f.rotulo}`); })) redraw();
    } : null,
  }));

  const entrada = at.danos || at.objetos ? el('div', { class: 'card' }, el('h2', { text: 'Estado na entrada' }), el('dl', { class: 'kv' },
    at.danos ? el('div', {}, el('dt', { text: 'Danos ou problemas' }), el('dd', { text: at.danos })) : null,
    at.objetos ? el('div', {}, el('dt', { text: 'Objetos pessoais' }), el('dd', { text: at.objetos })) : null)) : null;

  let ctrlCard = null;
  if (ctrl) {
    const sel = el('select', { 'aria-label': 'Ajustar etapa' },
      at.etapas.map((n, i) => el('option', { value: i, selected: !at.concluido && i === at.etapaIndex }, n)),
      el('option', { value: at.etapas.length, selected: at.concluido }, 'Concluído'));
    sel.addEventListener('change', () => { if (commit(() => ajustarEtapa(at, Number(sel.value)))) { toast('Etapa ajustada.'); redraw(); } });
    const excluir = el('button', { class: 'btn btn--danger', type: 'button', onclick: () => {
      if (!window.confirm(`Excluir o atendimento da placa ${fmtPlaca(at.placa)}? Ele fica 48 horas na lixeira (Ajustes > Lixeira) e pode ser restaurado nesse tempo.`)) return;
      if (commit(() => { DB.atendimentos = DB.atendimentos.filter(a => a.id !== at.id); })) {
        const u = me();
        DB.lixeira = [{ id: at.id, placa: at.placa, tipoNome: at.tipoNome, clienteNome: at.clienteNome, concluido: at.concluido, etapa: etapaAtual(at), criadoEm: at.criadoEm, excluidoEm: Date.now(), excluidoPor: u ? u.nome : '', fotos: at.fotos }, ...(DB.lixeira || [])];
        toast('Atendimento na lixeira por 48 horas.'); go('#/inicio');
      }
    } }, 'Excluir atendimento');
    ctrlCard = el('details', { class: 'card fold', open: S.ctrlAberto || null, ontoggle: e => { S.ctrlAberto = e.target.open; } },
      el('summary', {}, el('h2', { text: 'Opções do Controle' }), el('span', { class: 'fold-ico', html: ICON.down, 'aria-hidden': 'true' })),
      el('div', { class: 'field' }, el('span', { class: 'label', text: 'Ajustar etapa' }), sel),
      // Link de acompanhamento para mandar ao cliente (página /cliente já com a placa deste veículo).
      el('div', { class: 'field' }, el('span', { class: 'label', text: 'Link para o cliente acompanhar' }),
        (() => {
          const link = `${location.origin}/cliente#/${at.placa}`;
          const copiar = async () => {
            try { await navigator.clipboard.writeText(link); toast('Link copiado. É só colar no WhatsApp do cliente.'); }
            catch { window.prompt('Copie o link do cliente:', link); }
          };
          return el('div', { class: 'stack', style: 'gap:6px' },
            el('button', { class: 'btn btn--block', type: 'button', onclick: copiar }, 'Copiar link do cliente'),
            el('span', { class: 'hint', style: 'word-break:break-all', text: link }));
        })()),
      // Placa digitada ou lida errada: corrige no atendimento (o veículo com a placa errada continua no banco).
      el('div', { class: 'field' }, el('span', { class: 'label', text: 'Placa' }),
        (() => {
          const i = el('input', { class: 'plate-input', type: 'text', maxlength: '8', value: at.placa, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', 'aria-label': 'Placa correta' });
          const salvarPlaca = () => {
            const nova = norm(i.value);
            if (nova === at.placa) return;
            if (!isValid(nova)) { toast('Placa inválida. São 7 caracteres, como ABC1D23 ou ABC1234.', true); i.focus(); return; }
            const outro = ativoDaPlaca(nova);
            if (outro && outro.id !== at.id && !at.concluido) { toast(`A placa ${fmtPlaca(nova)} já tem um serviço em andamento.`, true); return; }
            if (!window.confirm(`Trocar a placa de ${fmtPlaca(at.placa)} para ${fmtPlaca(nova)}?`)) { i.value = at.placa; return; }
            const antiga = at.placa;
            if (commit(() => {
              if (!DB.veiculos[nova]) DB.veiculos[nova] = { placa: nova, descricao: (DB.veiculos[antiga] || {}).descricao || '', criadoEm: Date.now() };
              at.placa = nova;
              registrar(at, `Placa corrigida: ${fmtPlaca(antiga)} para ${fmtPlaca(nova)}`);
            })) { toast('Placa corrigida.'); redraw(); }
          };
          return el('div', { class: 'row' }, i, el('button', { class: 'btn', type: 'button', style: 'flex:none', onclick: salvarPlaca }, 'Corrigir'));
        })()),
      el('div', { class: 'field' }, el('span', { class: 'label', text: 'Nome do cliente' }),
        (() => { const i = el('input', { type: 'text', maxlength: '80', value: at.clienteNome || '', placeholder: NOME_PENDENTE, autocapitalize: 'words' });
          i.addEventListener('change', () => {
            const n = i.value.trim().replace(/\s+/g, ' ');
            if (n !== (at.clienteNome || '') && commit(() => { registrar(at, `Cliente: ${at.clienteNome || 'sem nome'} para ${n || 'sem nome'}`); at.clienteNome = n; })) { toast('Nome do cliente salvo.'); redraw(); }
          });
          return i; })()),
      el('div', { class: 'field' }, el('span', { class: 'label', text: 'Descrição do veículo' }),
        (() => { const i = el('input', { type: 'text', maxlength: '80', value: v.descricao || '' });
          i.addEventListener('change', () => commit(() => { DB.veiculos[at.placa] = { ...(DB.veiculos[at.placa] || {}), placa: at.placa, descricao: i.value.trim() }; }) && toast('Descrição salva.'));
          return i; })()),
      el('div', {}, excluir));
  }

  // Valor do serviço (só Controle): cartão próprio, logo abaixo das etapas.
  let valorCard = null;
  if (ctrl) {
    const editando = S.valorAberto === at.id;
    const abrir = on => { S.valorAberto = on ? at.id : null; redraw(); };
    if (editando) {
      const fValor = el('input', { type: 'text', inputmode: 'decimal', placeholder: '0,00', value: at.valor != null ? fmtQ(at.valor) : '', autocomplete: 'off', 'aria-label': 'Valor do serviço em reais' });
      const salvar = () => {
        const raw = fValor.value.trim(); const n = raw ? parseNum(raw) : null;
        if (raw && isNaN(n)) { toast('Valor inválido. Use só números, como 1960 ou 1.960,00.', true); fValor.focus(); return; }
        S.valorAberto = null;
        if (n === (at.valor == null ? null : at.valor)) { redraw(); return; }
        if (commit(() => { at.valor = n; registrar(at, n == null ? 'Valor removido' : `Valor definido: ${fmtBRL(n)}`); })) { toast('Valor salvo.'); redraw(); }
      };
      fValor.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); salvar(); } });
      valorCard = el('div', { class: 'card' },
        el('h2', { text: 'Valor do serviço' }),
        el('div', { class: 'row', style: 'align-items:center' }, el('span', { class: 'label', style: 'flex:none', text: 'R$' }), fValor),
        el('div', { class: 'actions' },
          el('button', { class: 'btn btn--primary grow', type: 'button', onclick: salvar }, 'Salvar valor'),
          el('button', { class: 'btn', type: 'button', onclick: () => abrir(false) }, 'Cancelar')));
      setTimeout(() => { fValor.focus(); fValor.select(); }, 50);
    } else {
      valorCard = el('div', { class: 'card' }, el('div', { class: 'valor-box' },
        el('div', { style: 'display:grid;gap:4px' },
          el('span', { class: 'label', text: 'Valor do serviço' }),
          el('span', { class: 'valor-num' + (at.valor == null ? ' vazio' : ''), text: at.valor == null ? 'Ainda sem valor' : fmtBRL(at.valor) })),
        el('button', { class: 'btn' + (at.valor == null ? ' btn--primary' : ''), type: 'button', style: 'flex:none', onclick: () => abrir(true) }, at.valor == null ? 'Lançar valor' : 'Alterar')));
    }
  }

  const pct = Math.round(progresso(at) * 100);
  const body = el('div', { class: 'stack', style: 'max-width:720px' },
    backLink(at.concluido ? '#/historico' : '#/inicio', at.concluido ? 'Histórico' : 'Em serviço'),
    el('div', { class: 'veh-head' },
      el('span', { class: 'veh-plate', text: fmtPlaca(at.placa) }),
      at.clienteNome ? el('span', { style: 'font-weight:600', text: at.clienteNome }) : el('span', { style: 'font-weight:600;color:var(--warn)', text: `(${NOME_PENDENTE})` }),
      el('span', { class: 'veh-sub', text: [v.descricao, at.tipoNome, `entrada em ${fmtDataHora(at.criadoEm)}`].filter(Boolean).join(' · ') })),
    el('div', { class: 'card' },
      el('div', { class: 'card-head' }, el('h2', { text: at.concluido ? 'Serviço concluído' : `Em ${at.etapas[at.etapaIndex].toLowerCase()}` }),
        el('span', { class: 'tag' + (at.concluido ? ' tag--ok' : ' tag--dark'), text: `${pct}%` })),
      el('div', { class: 'bar' }, el('i', { style: `width:${pct}%` })),
      steps, concluirBtn),
    valorCard,
    el('div', { class: 'card' }, el('div', { class: 'card-head' }, el('h2', { text: 'Fotos da entrada' }), el('span', { class: 'count', text: `${at.fotos.filter(f => !eFotoDeEtapa(f)).length}` })),
      at.fotosApagadas ? el('p', { class: 'hint', text: `${at.fotosApagadas} ${at.fotosApagadas === 1 ? 'foto foi apagada' : 'fotos foram apagadas'} pela limpeza automática (serviço concluído há mais de ${DB.ajustes.limpezaDias} dias).` }) : null,
      fotosBox),
    entrada,
    ctrlCard,
    // Histórico só para o Controle (tem os valores lançados).
    isCtrl() ? el('div', { class: 'card' }, el('h2', { text: 'Histórico' }),
      listaRecolhivel(`hist:${at.id}`, at.historico.slice().reverse(), h => el('li', {}, el('span', { text: h.texto }), el('span', { text: [h.porNome, ago(h.em)].filter(Boolean).join(' · ') })))) : null);
  shell(body, { current: at.concluido ? 'relatorios' : 'inicio' });
}

/* =====================================================================
   Tela: estoque
   Funcionário registra retirada. Controle registra entrada, contagem e mínimo.
   ===================================================================== */
function renderStock() {
  const ctrl = isCtrl(), u = me();
  const itens = DB.estoque.itens;
  const cards = itens.map(it => {
    const s = saldo(it.id), sit = situacao(it);
    const ult = DB.estoque.movimentos.filter(m => m.itemId === it.id && m.tipo === 'saida').slice(-1)[0];
    const open = S.stockOpen && S.stockOpen.itemId === it.id ? S.stockOpen.mode : null;
    const toggle = mode => { S.stockOpen = open === mode ? null : { itemId: it.id, mode }; renderStock(); };

    let form = null;
    if (open) {
      const qInit = open === 'ajuste' ? fmtQ(Math.max(0, s)) : open === 'minimo' ? fmtQ(it.minimo) : '1';
      const q = el('input', { type: 'text', inputmode: 'decimal', value: qInit, autocomplete: 'off', 'aria-label': 'Quantidade' });
      const bump = d => { const n = parseNum(q.value); q.value = fmtQ(Math.max(0, (isNaN(n) ? 0 : n) + d)); };
      const obs = el('input', { type: 'text', maxlength: '120', placeholder: open === 'entrada' ? 'Nota, fornecedor (opcional)' : 'Observação (opcional)' });
      const label = { saida: 'Confirmar retirada', entrada: 'Registrar entrada', ajuste: 'Salvar contagem', minimo: 'Salvar mínimo' }[open];
      const confirm = el('button', { class: 'btn btn--primary grow', type: 'button', onclick: () => {
        const n = parseNum(q.value);
        if (isNaN(n) || (open !== 'ajuste' && open !== 'minimo' && n <= 0)) { toast('Informe uma quantidade válida.', true); return; }
        let msg = '';
        const ok = commit(() => {
          if (open === 'saida') { movimentar(it.id, 'saida', -n, obs.value.trim()); msg = `Retirada registrada: ${fmtQ(n)} ${it.unidade}.`; }
          else if (open === 'entrada') { movimentar(it.id, 'entrada', n, obs.value.trim()); msg = `Entrada registrada: ${fmtQ(n)} ${it.unidade}.`; }
          else if (open === 'ajuste') { const d = round2(n - saldo(it.id)); if (d !== 0) movimentar(it.id, 'ajuste', d, obs.value.trim() || 'Contagem'); msg = d === 0 ? 'Contagem confere com o saldo.' : 'Saldo corrigido pela contagem.'; }
          else if (open === 'minimo') { it.minimo = n; msg = n > 0 ? `Aviso quando chegar a ${fmtQ(n)} ${it.unidade}.` : 'Mínimo removido.'; }
        });
        if (ok) { S.stockOpen = null; toast(msg); renderStock(); }
      } }, label);
      form = el('div', { class: 'inline-form' },
        el('span', { class: 'label', text: { saida: `Quantas ${it.unidade}s você retirou?`, entrada: `Quantas ${it.unidade}s entraram?`, ajuste: `Quantas ${it.unidade}s tem agora? (contagem física)`, minimo: `Avisar quando chegar a quantas ${it.unidade}s?` }[open] }),
        el('div', { class: 'stepper' },
          el('button', { type: 'button', 'aria-label': 'Menos', onclick: () => bump(-1) }, '−'), q,
          el('button', { type: 'button', 'aria-label': 'Mais', onclick: () => bump(1) }, '+')),
        open === 'minimo' ? null : obs,
        el('div', { class: 'actions' }, confirm, el('button', { class: 'btn', type: 'button', onclick: () => toggle(open) }, 'Cancelar')));
    }
    const actions = el('div', { class: 'actions' },
      el('button', { class: 'btn grow' + (ctrl ? '' : ' btn--primary'), type: 'button', 'aria-expanded': open === 'saida', onclick: () => toggle('saida') }, 'Retirar'),
      ctrl ? el('button', { class: 'btn grow btn--primary', type: 'button', 'aria-expanded': open === 'entrada', onclick: () => toggle('entrada') }, 'Entrada') : null);
    const ctrlLinks = ctrl ? el('div', { class: 'actions', style: 'gap:14px' },
      el('button', { class: 'link-btn', type: 'button', onclick: () => toggle('ajuste') }, 'Contagem'),
      el('button', { class: 'link-btn', type: 'button', onclick: () => toggle('minimo') }, 'Estoque mínimo')) : null;
    return el('li', { class: 'item' + (sit.k === 'low' ? ' is-low' : sit.k !== 'ok' ? ' is-out' : '') },
      el('div', { class: 'item-top' },
        el('div', { style: 'display:grid;gap:4px' },
          el('span', { class: 'item-name', text: it.nome }),
          sit.txt ? el('span', {}, el('span', { class: 'tag ' + sit.cls, text: sit.txt })) : null,
          el('span', { class: 'item-min', text: it.minimo > 0 ? `Mínimo: ${fmtQ(it.minimo)} ${it.unidade}` : ctrl ? 'Sem mínimo definido' : '' })),
        el('span', { class: 'item-qty' }, fmtQ(s), ' ', el('small', { text: it.unidade }))),
      ult ? el('span', { class: 'item-last', text: `Última retirada: ${fmtQ(-ult.delta)} ${it.unidade}, ${ult.porId === (u && u.id) ? 'você' : ult.porNome}, ${ago(ult.em)}` }) : null,
      sit.k === 'neg' && ctrl ? el('span', { class: 'item-last', style: 'color:var(--danger)', text: 'Retiraram mais do que entrou. Falta registrar uma entrada ou fazer contagem.' }) : null,
      actions, ctrlLinks, form);
  });

  const movs = DB.estoque.movimentos.filter(m => ctrl || m.porId === (u && u.id)).slice().reverse();
  const tipoTxt = { entrada: 'Entrada', saida: 'Retirada', ajuste: 'Contagem' };
  const movList = movs.length ? listaRecolhivel('movimentos', movs, m => {
    const it = itens.find(x => x.id === m.itemId);
    const sinal = m.delta > 0 ? '+' : '−';
    return el('li', {}, el('span', { text: `${tipoTxt[m.tipo]} ${sinal}${fmtQ(Math.abs(m.delta))} ${it ? it.unidade : ''} ${it ? it.nome : '(removido)'}${m.obs && m.tipo !== 'ajuste' ? ` (${m.obs})` : ''}` }),
      el('span', { text: `${ctrl ? m.porNome + ' · ' : ''}${fmtDataHora(m.em)}` }));
  }) : el('p', { class: 'hint', text: ctrl ? 'Nenhum movimento ainda.' : 'Você ainda não registrou retiradas.' });

  let novo = null;
  if (ctrl) {
    const n = el('input', { type: 'text', maxlength: '60', placeholder: 'Ex.: Cola de contato' });
    const un = el('input', { type: 'text', maxlength: '20', placeholder: 'lata, rolo, m²' });
    novo = el('div', { class: 'card' }, el('h2', { text: 'Novo material' }),
      el('div', { class: 'row' }, el('div', { class: 'field' }, el('span', { class: 'label', text: 'Nome' }), n), el('div', { class: 'field', style: 'flex:.6' }, el('span', { class: 'label', text: 'Unidade' }), un)),
      el('div', {}, el('button', { class: 'btn', type: 'button', onclick: () => {
        const nome = n.value.trim(); if (!nome) { toast('Digite o nome do material.', true); return; }
        if (itens.some(x => x.nome.toLowerCase() === nome.toLowerCase())) { toast('Esse material já existe.', true); return; }
        if (commit(() => DB.estoque.itens.push({ id: uid(), nome, unidade: un.value.trim() || 'un', minimo: 0 }))) { toast('Material adicionado.'); renderStock(); }
      } }, 'Adicionar material')));
  }

  const alertas = itensEmAlerta();
  const body = el('div', { class: 'stack-lg' },
    el('div', { class: 'stack' },
      el('div', { class: 'page-head' }, el('h1', { text: 'Estoque' }), alertas.length ? el('span', { class: 'tag tag--warn', text: `${alertas.length} ${alertas.length === 1 ? 'aviso' : 'avisos'}` }) : null),
      ctrl ? null : el('p', { class: 'hint', text: 'Registre aqui cada material que você pegar.' }),
      itens.length ? el('ul', { class: 'stock' }, cards) : el('p', { class: 'empty', text: 'Nenhum material cadastrado.' })),
    el('div', { class: 'card' }, el('h2', { text: ctrl ? 'Movimentos' : 'Suas retiradas' }), movList),
    novo);
  shell(body, { current: 'estoque' });
}

/* =====================================================================
   Tela: histórico (Controle)
   ===================================================================== */
function renderHistory() {
  const all = DB.atendimentos.filter(a => a.concluido).sort((a, b) => (b.concluidoEm || 0) - (a.concluidoEm || 0));
  const list = el('ul', { class: 'rows' });
  const empty = el('p', { class: 'empty' });
  const draw = () => {
    const q = S.histQuery.trim().toLowerCase(), q2 = norm(q);
    const items = !q ? all : all.filter(a => (q2 && a.placa.includes(q2)) || [a.clienteNome, (DB.veiculos[a.placa] || {}).descricao, a.tipoNome].join(' ').toLowerCase().includes(q));
    list.replaceChildren(...items.map(a => {
      const capa = capaDe(a), v = DB.veiculos[a.placa] || {};
      return el('li', {}, el('a', { class: 'r', href: `#/veiculo/${esc(a.id)}`, style: 'color:inherit;text-decoration:none' },
        el('span', { class: 'r-thumb' }, capa ? photoImg(capa, '') : null),
        el('span', { class: 'r-main' }, el('span', { class: 'r-plate', text: fmtPlaca(a.placa) }), el('span', { class: 'r-sub', text: [a.clienteNome, v.descricao, a.tipoNome].filter(Boolean).join(' · ') })),
        el('span', { class: 'r-side' }, el('div', { text: a.concluidoEm ? fmtData(a.concluidoEm) : '' }), a.valor != null ? el('div', { style: 'color:var(--ink);font-weight:600', text: fmtBRL(a.valor) }) : null)));
    }));
    list.hidden = !items.length; empty.hidden = !!items.length;
    empty.textContent = all.length ? 'Nada encontrado.' : 'Nenhum serviço concluído ainda.';
  };
  const body = el('div', { class: 'stack', style: 'max-width:720px' },
    el('div', { class: 'page-head' }, el('h1', { text: 'Histórico' }), el('span', { class: 'count', text: all.length ? `${all.length} concluídos` : '' })),
    el('div', { class: 'search' }, icon('search'), el('input', { type: 'search', placeholder: 'Buscar placa, cliente ou veículo', value: S.histQuery, 'aria-label': 'Buscar no histórico', oninput: e => { S.histQuery = e.target.value; draw(); } })),
    list, empty);
  shell(body, { current: 'relatorios' });
  draw();
}

/* =====================================================================
   Tela: ajustes (Controle): tipos de serviço, equipe, backup
   ===================================================================== */
function renderSettings() {
  const redraw = () => { const y = window.scrollY; renderSettings(); window.scrollTo(0, y); };
  const tipos = DB.tipos.map(t => {
    const emUso = DB.atendimentos.filter(a => a.tipoId === t.id && !a.concluido).length;
    const fora = foraDoTipo(t).length;
    // Toda mudança nas etapas vale também para os veículos em andamento deste tipo.
    const mudarEtapas = fn => {
      commit(() => { fn(); sincronizarEtapas(t); });
      if (emUso && t.etapas.length) toast(`Etapas atualizadas também ${emUso === 1 ? 'no veículo' : `nos ${emUso} veículos`} em andamento.`);
      redraw();
    };
    const add = el('input', { type: 'text', maxlength: '60', placeholder: 'Nova etapa' });
    const addEtapa = () => { const v = add.value.trim(); if (!v) return; mudarEtapas(() => t.etapas.push(v)); };
    add.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addEtapa(); } });
    const move = (i, d) => mudarEtapas(() => { const [x] = t.etapas.splice(i, 1); t.etapas.splice(i + d, 0, x); });

// Lixeira (Controle): atendimentos excluídos ficam 48 h aqui e podem voltar. Depois somem da lista

const LIXEIRA_H = 48;
function cartaoLixeira(redraw) {

  const restam = x => `Restam ${Math.max(1, Math.ceil((x.excluidoEm + LIXEIRA_H * 3600e3 - Date.now()) / 3600e3))} h`;
  const restaurar = async (x, btn) => {
    if (ativoDaPlaca(x.placa) && !x.concluido) { toast(`A placa ${fmtPlaca(x.placa)} já tem um serviço em andamento.`, true); return; }
    btn.disabled = true; S.ocupado = true;
    const ok = await enviar([{ col: 'atendimentos', acao: 'restaurar', id: x.id }], { redesenhar: false });
    S.ocupado = false;
    if (ok) { try { await buscarDados({ forcar: true }); } catch {} toast(`Atendimento da placa ${fmtPlaca(x.placa)} restaurado.`); }
    redraw();

  return el('section', { class: 'stack' },
    el('h2', { text: 'Lixeira' }),
    el('div', { class: 'card' },

            el('span', { class: 'r-sub', text: [restam(x), x.excluidoPor && `excluído por ${x.excluidoPor}`].filter(Boolean).join(' · ') })),

/* =====================================================================
   Datas (agenda e relatórios). Dias no formato AAAA-MM-DD, no fuso do aparelho.
   ===================================================================== */
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const DIAS_SEMANA = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
const pad2 = n => String(n).padStart(2, '0');
const isoDia = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
const isoDe = dt => isoDia(dt.getFullYear(), dt.getMonth(), dt.getDate());
const hojeISO = () => isoDe(new Date());
const dataDe = k => { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, m - 1, d); };
const somaDias = (k, n) => { const d = dataDe(k); d.setDate(d.getDate() + n); return isoDe(d); };
const brDia = k => (k ? `${k.slice(8, 10)}/${k.slice(5, 7)}` : '');
const brData = k => (k ? `${k.slice(8, 10)}/${k.slice(5, 7)}/${k.slice(0, 4)}` : '');

// Feriados: nacionais, Rondônia e Jaru (os mesmos da agenda antiga).
const cacheFeriados = {};
function feriados(y) {
  if (cacheFeriados[y]) return cacheFeriados[y];
  const f = {};
  const add = (k, nome) => { f[k] = f[k] ? `${f[k]} · ${nome}` : nome; };
  [[0, 1, 'Confraternização Universal'], [3, 21, 'Tiradentes'], [4, 1, 'Dia do Trabalho'], [8, 7, 'Independência do Brasil'],
    [9, 12, 'Nossa Senhora Aparecida'], [10, 2, 'Finados'], [10, 15, 'Proclamação da República'], [10, 20, 'Consciência Negra'],
    [11, 25, 'Natal'], [0, 4, 'Instalação do Estado de Rondônia'], [5, 16, 'Criação do município de Jaru'],
    [5, 24, 'São João Batista, padroeiro de Jaru'], [11, 24, 'Véspera de Natal'], [11, 31, 'Véspera de Ano-Novo']]
    .forEach(([m, d, n]) => add(isoDia(y, m, d), n));
  // Páscoa (algoritmo de Meeus) e as datas móveis
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, g = Math.floor((b - Math.floor((b + 8) / 25) + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, mm = Math.floor((a + 11 * h + 22 * l) / 451);
  const pascoa = isoDia(y, Math.floor((h + l - 7 * mm + 114) / 31) - 1, ((h + l - 7 * mm + 114) % 31) + 1);
  add(somaDias(pascoa, -48), 'Carnaval'); add(somaDias(pascoa, -47), 'Carnaval'); add(somaDias(pascoa, -46), 'Quarta-feira de Cinzas');
  add(somaDias(pascoa, -2), 'Sexta-feira Santa'); add(somaDias(pascoa, 60), 'Corpus Christi');
  return (cacheFeriados[y] = f);
}

/* =====================================================================
   Tela: relatórios (Controle). Faturamento e estoque por período; PDF para baixar.
   Faturamento = serviços concluídos no período (pela data de conclusão) que têm valor.
   ===================================================================== */
function periodoRel() {
  if (!S.rel) S.rel = { preset: 'mes' };
  const R = S.rel, t = new Date();
  if (R.preset === 'mes') { R.de = isoDia(t.getFullYear(), t.getMonth(), 1); R.ate = isoDia(t.getFullYear(), t.getMonth() + 1, 0); }
  else if (R.preset === 'anterior') { R.de = isoDia(t.getFullYear(), t.getMonth() - 1, 1); R.ate = isoDia(t.getFullYear(), t.getMonth(), 0); }
  else if (R.preset === 'ano') { R.de = isoDia(t.getFullYear(), 0, 1); R.ate = isoDia(t.getFullYear(), 11, 31); }
  else { R.de = R.de || isoDia(t.getFullYear(), t.getMonth(), 1); R.ate = R.ate || hojeISO(); }
  // isoDia com dia 0 volta para o último dia do mês anterior; normaliza pelo Date
  R.de = isoDe(dataDe(R.de)); R.ate = isoDe(dataDe(R.ate));
  if (R.ate < R.de) [R.de, R.ate] = [R.ate, R.de];
  return R;
}
function calcularRelatorio(de, ate) {
  const ini = dataDe(de).getTime(), fim = dataDe(somaDias(ate, 1)).getTime();
  const dentro = ms => ms != null && ms >= ini && ms < fim;
  const concluidos = DB.atendimentos.filter(a => a.concluido && dentro(a.concluidoEm)).sort((a, b) => a.concluidoEm - b.concluidoEm);
  const comValor = concluidos.filter(a => a.valor != null);
  const faturamento = round2(comValor.reduce((s, a) => s + a.valor, 0));
  const porTipo = new Map();
  for (const a of comValor) { const t = porTipo.get(a.tipoNome || 'Sem tipo') || { qtd: 0, total: 0 }; t.qtd++; t.total = round2(t.total + a.valor); porTipo.set(a.tipoNome || 'Sem tipo', t); }
  const andamento = DB.atendimentos.filter(a => !a.concluido);
  const previsto = round2(andamento.reduce((s, a) => s + (a.valor || 0), 0));
  const movs = DB.estoque.movimentos.filter(m => dentro(m.em));
  const itens = DB.estoque.itens.map(it => {
    const ms = movs.filter(m => m.itemId === it.id);
    const soma = tipo => round2(ms.filter(m => m.tipo === tipo).reduce((s, m) => s + m.delta, 0));
    return { nome: it.nome, unidade: it.unidade, entrou: soma('entrada'), saiu: -soma('saida'), ajuste: soma('ajuste'), saldo: saldo(it.id) };
  });
  const porPessoa = new Map();
  for (const m of movs.filter(m => m.tipo === 'saida')) {
    const it = DB.estoque.itens.find(x => x.id === m.itemId); if (!it) continue;
    const k = `${m.porNome || 'Sem nome'}|${it.id}`;
    const r = porPessoa.get(k) || { pessoa: m.porNome || 'Sem nome', material: it.nome, unidade: it.unidade, qtd: 0 };
    r.qtd = round2(r.qtd - m.delta); porPessoa.set(k, r);
  }
  return {
    de, ate, concluidos, comValor, faturamento, semValor: concluidos.length - comValor.length,
    ticket: comValor.length ? round2(faturamento / comValor.length) : 0,
    porTipo: [...porTipo].map(([tipo, t]) => ({ tipo, ...t })).sort((a, b) => b.total - a.total),
    andamento: andamento.length, previsto, itens,
    retiradas: [...porPessoa.values()].sort((a, b) => a.pessoa.localeCompare(b.pessoa) || a.material.localeCompare(b.material)),
  };
}

/* ---------- Envio dos dados antigos (de antes do banco) ----------
   Funcionários, tipos e materiais são ligados pelo nome aos que já existem no banco.

function cartaoDadosAntigos(redraw) {

async function importarAntigos(d, progresso) {
  const porNome = (lista, nome) => lista.find(x => x.nome.trim().toLowerCase() === String(nome || '').trim().toLowerCase());
  const mapFunc = new Map(), mapTipo = new Map(), mapItem = new Map();
  const novosFunc = [], novosTipos = [], novosItens = [];
  for (const f of d.funcionarios || []) {
    const x = porNome(DB.funcionarios, f.nome) || porNome(novosFunc, f.nome);
    if (x) mapFunc.set(f.id, x.id); else { const n = { id: uid(), nome: f.nome, nivel: f.nivel === 'controle' ? 'controle' : 'funcionario' }; novosFunc.push(n); mapFunc.set(f.id, n.id); }
  }
  for (const t of d.tipos || []) {
    const x = porNome(DB.tipos, t.nome) || porNome(novosTipos, t.nome);
    if (x) mapTipo.set(t.id, x.id); else { const n = { id: uid(), nome: t.nome, etapas: [...(t.etapas || [])] }; novosTipos.push(n); mapTipo.set(t.id, n.id); }
  }
  for (const it of (d.estoque || {}).itens || []) {
    const x = porNome(DB.estoque.itens, it.nome) || porNome(novosItens, it.nome);
    if (x) mapItem.set(it.id, x.id); else { const n = { id: uid(), nome: it.nome, unidade: it.unidade || 'un', minimo: Number(it.minimo) || 0 }; novosItens.push(n); mapItem.set(it.id, n.id); }
  }
  const pessoa = id => (id && mapFunc.get(id)) || id || null;

  // Atendimentos: pula os já enviados e os de placa que já tem serviço em andamento no banco.
  const jaTem = new Set(DB.atendimentos.map(a => a.id));
  const emAndamento = new Set(DB.atendimentos.filter(a => !a.concluido).map(a => a.placa));
  const ats = [];
  let pulados = 0, nFotos = 0;
  const lista = (d.atendimentos || []).filter(a => !jaTem.has(a.id) && isValid(a.placa) && (a.etapas || []).length);
  for (const [i, a] of lista.entries()) {
    if (!a.concluido && emAndamento.has(a.placa)) { pulados++; continue; }
    if (!a.concluido) emAndamento.add(a.placa);
    progresso(`Enviando atendimento ${i + 1} de ${lista.length} (${fmtPlaca(a.placa)})…`);
    const fotos = [];
    for (const f of a.fotos || []) {
      let blob = null; try { blob = await fotoAntiga(f.id); } catch {}
      if (!blob) continue;
      fotos.push({ ...(await enviarFoto(blob)), rotulo: f.rotulo, em: f.em || a.criadoEm });
      nFotos++;
    }
    ats.push({
      id: a.id, placa: a.placa, tipoId: mapTipo.get(a.tipoId) || null, tipoNome: a.tipoNome || '', etapas: [...a.etapas],
      etapaIndex: Math.min(Math.max(0, a.etapaIndex | 0), a.etapas.length - 1), feitas: a.feitas || {}, concluido: !!a.concluido,
      concluidoEm: a.concluidoEm || null, criadoEm: a.criadoEm || Date.now(), criadoPorNome: a.criadoPorNome || '',
      danos: a.danos || '', objetos: a.objetos || '', valor: a.valor == null ? null : Number(a.valor), fotos,
      historico: (a.historico || []).map(h => ({ ...h, porId: pessoa(h.porId) })),
    });
  }
  const jaMov = new Set(DB.estoque.movimentos.map(m => m.id));
  const movs = ((d.estoque || {}).movimentos || []).filter(m => !jaMov.has(m.id) && mapItem.has(m.itemId))
    .map(m => ({ ...m, itemId: mapItem.get(m.itemId), porId: pessoa(m.porId) }));

  progresso('Salvando no banco…');
  const ok = await commitAgora(() => {
    DB.funcionarios.push(...novosFunc);
    DB.tipos.push(...novosTipos);
    DB.estoque.itens.push(...novosItens);
    for (const [placa, v] of Object.entries(d.veiculos || {})) {
      if (!isValid(placa)) continue;
      const atual = DB.veiculos[placa];
      if (!atual) DB.veiculos[placa] = { placa, descricao: v.descricao || '', criadoEm: v.criadoEm || Date.now() };
      else if (!atual.descricao && v.descricao) atual.descricao = v.descricao;
    }
    for (const a of ats) if (!DB.veiculos[a.placa]) DB.veiculos[a.placa] = { placa: a.placa, descricao: '', criadoEm: a.criadoEm };
    DB.atendimentos.push(...ats);
    DB.estoque.movimentos.push(...movs);
  });
  if (!ok) throw new Error('importar');
  return { atendimentos: ats.length, fotos: nFotos, movimentos: movs.length, pulados };
}

    : [el('div', { class: 'card' }, el('h2', { text: 'Andamento' }),
